<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <style>
    .axis { stroke: black; stroke-width: 1.5; }
    .peak { stroke: black; stroke-width: 2; }
    .label { font-family: sans-serif; font-size: 13px; text-anchor: middle; }
    .axis-label { font-family: sans-serif; font-size: 13px; }
    .title { font-family: sans-serif; font-size: 16px; font-weight: bold; }
  </style>

  <!-- Option A -->
  <g transform="translate(40, 30)">
    <text x="0" y="0" class="title">A</text>
    <line x1="30" y1="150" x2="30" y2="30" class="axis" />
    <polygon points="26,30 30,20 34,30" fill="black" />
    <text x="-90" y="15" class="axis-label" transform="rotate(-90)">Intensity</text>
    
    <line x1="30" y1="150" x2="230" y2="150" class="axis" />
    <polygon points="230,146 240,150 230,154" fill="black" />
    <text x="245" y="154" class="axis-label">m/e</text>
    
    <line x1="100" y1="150" x2="100" y2="50" class="peak" />
    <text x="100" y="170" class="label">172</text>
    <line x1="160" y1="150" x2="160" y2="50" class="peak" />
    <text x="160" y="170" class="label">174</text>
  </g>

  <!-- Option C -->
  <g transform="translate(340, 30)">
    <text x="0" y="0" class="title">C</text>
    <line x1="30" y1="150" x2="30" y2="30" class="axis" />
    <polygon points="26,30 30,20 34,30" fill="black" />
    <text x="-90" y="15" class="axis-label" transform="rotate(-90)">Intensity</text>
    
    <line x1="30" y1="150" x2="230" y2="150" class="axis" />
    <polygon points="230,146 240,150 230,154" fill="black" />
    <text x="245" y="154" class="axis-label">m/e</text>
    
    <line x1="130" y1="150" x2="130" y2="50" class="peak" />
    <text x="130" y="170" class="label">174</text>
  </g>

  <!-- Option B -->
  <g transform="translate(40, 250)">
    <text x="0" y="0" class="title">B</text>
    <line x1="30" y1="150" x2="30" y2="30" class="axis" />
    <polygon points="26,30 30,20 34,30" fill="black" />
    <text x="-90" y="15" class="axis-label" transform="rotate(-90)">Intensity</text>
    
    <line x1="30" y1="150" x2="230" y2="150" class="axis" />
    <polygon points="230,146 240,150 230,154" fill="black" />
    <text x="245" y="154" class="axis-label">m/e</text>
    
    <line x1="70" y1="150" x2="70" y2="100" class="peak" />
    <text x="70" y="170" class="label">172</text>
    <line x1="130" y1="150" x2="130" y2="50" class="peak" />
    <text x="130" y="170" class="label">174</text>
    <line x1="190" y1="150" x2="190" y2="100" class="peak" />
    <text x="190" y="170" class="label">176</text>
  </g>

  <!-- Option D -->
  <g transform="translate(340, 250)">
    <text x="0" y="0" class="title">D</text>
    <line x1="30" y1="150" x2="30" y2="30" class="axis" />
    <polygon points="26,30 30,20 34,30" fill="black" />
    <text x="-90" y="15" class="axis-label" transform="rotate(-90)">Intensity</text>
    
    <line x1="30" y1="150" x2="230" y2="150" class="axis" />
    <polygon points="230,146 240,150 230,154" fill="black" />
    <text x="245" y="154" class="axis-label">m/e</text>
    
    <line x1="70" y1="150" x2="70" y2="50" class="peak" />
    <text x="70" y="170" class="label">172</text>
    <line x1="130" y1="150" x2="130" y2="50" class="peak" />
    <text x="130" y="170" class="label">174</text>
    <line x1="190" y1="150" x2="190" y2="50" class="peak" />
    <text x="190" y="170" class="label">176</text>
  </g>
</svg>
