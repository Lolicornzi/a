<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <style>
    .box { fill: none; stroke: black; stroke-width: 1.5; }
    .line { stroke: black; stroke-width: 1.5; }
    .dense { fill: black; }
    .label { font-family: sans-serif; font-size: 16px; font-style: italic; font-weight: bold; }
  </style>
  
  <rect x="40" y="30" width="400" height="60" class="box" />
  
  <!-- Convergence Limit Block -->
  <rect x="40" y="30" width="20" height="60" class="dense" />
  
  <!-- Spectral Lines Spacing Out -->
  <line x1="65" y1="30" x2="65" y2="90" class="line" />
  <line x1="72" y1="30" x2="72" y2="90" class="line" />
  <line x1="82" y1="30" x2="82" y2="90" class="line" />
  <line x1="97" y1="30" x2="97" y2="90" class="line" />
  <line x1="120" y1="30" x2="120" y2="90" class="line" />
  <line x1="155" y1="30" x2="155" y2="90" class="line" />
  <line x1="210" y1="30" x2="210" y2="90" class="line" />
  <line x1="290" y1="30" x2="290" y2="90" class="line" />
  
  <!-- Furthest Line Labeled 'X' -->
  <line x1="410" y1="30" x2="410" y2="90" class="line" />
  <text x="405" y="115" class="label">X</text>
</svg>
