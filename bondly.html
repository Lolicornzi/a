<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bondly: learn biology and chemistry</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap');

:root{
  --ink:#15213b; --ink2:#4d5a78; --paper:#f1f5f9; --card:#fff; --line:#d5dde8;
  --chem:#5b3fd6; --chem-d:#3d27a6; --chem-l:#ece8fc;
  --bio:#16945f; --bio-d:#0d6a43; --bio-l:#e0f4ea;
  --ok:#1fa35b; --ok-d:#137a41; --ok-l:#dcf4e6;
  --bad:#e0452b; --bad-d:#ae2b15; --bad-l:#fde4de;
  --gold:#f5b82a; --gold-d:#c28a08;
  --accent:var(--chem); --accent-d:var(--chem-d); --accent-l:var(--chem-l);
}
body.bio{ --accent:var(--bio); --accent-d:var(--bio-d); --accent-l:var(--bio-l); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh;
  background-color:var(--paper);
  background-image:linear-gradient(rgba(21,33,59,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(21,33,59,.05) 1px,transparent 1px);
  background-size:24px 24px;
}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;letter-spacing:-.01em;margin:0;line-height:1.12}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.main{padding:14px 16px 110px}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:15px;padding:14px 18px;font-weight:800;font-size:16px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d);text-align:center;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--accent-d)}
.btn.small.ghost{box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* login */
.login{padding:36px 22px 40px}
.login .ring{width:92px;height:92px;display:block;margin:0 0 14px}
.login h1{font-size:44px;font-weight:800}
.login .tag{font-size:19px;color:var(--ink2);margin:8px 0 26px;max-width:22em}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
label.f small{font-weight:400;color:var(--ink2)}
input[type=text],input[type=email],textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:13px;padding:12px 14px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
.err{color:var(--bad-d);font-weight:700;font-size:14px;min-height:20px;margin:10px 0}
.fine{font-size:13px;color:var(--ink2);margin-top:14px}

/* top area */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.seg{flex:1;display:flex;background:#fff;border:2px solid var(--line);border-radius:15px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#fff}
.chip.total{background:var(--gold);color:#4a3300;font-weight:800;border-radius:999px;padding:8px 13px;white-space:nowrap}
.semtabs{display:flex;gap:8px;margin-bottom:12px}
.semtabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--ink2)}
.semtabs button.on{border-color:var(--accent);color:var(--accent-d);background:var(--accent-l)}
.sembanner{background:var(--accent);color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 5px 0 var(--accent-d)}
.sembanner h2{font-size:24px}
.sembanner .n{font-size:14px;opacity:.85;margin-bottom:2px}
.sembanner p.b{font-size:15px;margin-top:6px;opacity:.95}

/* path */
.path{padding:6px 0 4px}
.step{display:flex;flex-direction:column;align-items:center;margin:20px 0 4px;transform:translateX(var(--dx,0))}
.hex{position:relative;width:84px;height:102px;border:0;background:none;padding:0}
.hex .hb,.hex .hf{position:absolute;left:0;width:84px;height:96px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex .hb{top:6px;background:var(--accent-d)}
.hex .hf{top:0;background:var(--accent);display:grid;place-items:center;font-size:32px;transition:transform .07s}
.hex:active .hf{transform:translateY(5px)}
.hex.locked .hb{background:#b3bfce}
.hex.locked .hf{background:#d5dce7;font-size:26px}
.hex.done .hb{background:var(--gold-d)}
.hex.done .hf{background:var(--gold)}
.hex.current .hf{animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.sl{font-weight:700;font-size:14px;margin-top:6px;text-align:center;max-width:150px}
.stars{color:var(--gold-d);letter-spacing:2px;font-size:15px}
.mmhead{margin:34px 0 4px;background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px}
.mmhead h3{font-size:21px;margin-bottom:6px}
.mmhead p{font-size:14px;opacity:.88}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;width:100%;max-width:540px}
.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;color:var(--ink2);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:22px;line-height:1.1}
.tabs button.on{color:var(--accent-d)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(21,33,59,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;background:#fff;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .ic{font-size:40px}
.sheet h3{font-size:24px;margin:4px 0 2px}
.sheet .sub{color:var(--ink2);font-size:14px;margin-bottom:12px}
.stats{display:flex;gap:10px;margin:12px 0 18px}
.stat{flex:1;border:2px solid var(--line);border-radius:14px;padding:9px 10px}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px}
.stat span{font-size:12px;color:var(--ink2)}

/* lesson */
.play{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:14px 16px 190px}
.ptop{display:flex;align-items:center;gap:12px}
.x{border:0;background:none;font-size:22px;color:var(--ink2);padding:4px 6px}
.spectrum{flex:1;height:14px;border-radius:99px;overflow:hidden;position:relative;background:linear-gradient(90deg,#e0452b,#f0892a,#f5cf3a,#3fb950,#2f8ae0,#6a45d8)}
.spectrum .cover{position:absolute;right:0;top:0;bottom:0;background:#dfe6ef;transition:width .35s ease}
.live{display:flex;gap:10px;font-weight:800;font-size:14px;white-space:nowrap}
.tbar{height:6px;background:#dfe6ef;border-radius:9px;overflow:hidden;margin:16px 0 22px}
.tbar i{display:block;height:100%;width:100%;background:var(--accent);animation:drain linear forwards}
@keyframes drain{from{width:100%}to{width:0}}
.qtag{font-size:13px;font-weight:700;color:var(--accent-d);margin-bottom:6px}
.qtext{font-size:23px;font-weight:800;font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.22;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:13px 14px;font-weight:500;color:var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--ink2)}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--ok-l);border-color:var(--ok);color:var(--ok-d)}
.opt.ok .k{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-l);border-color:var(--bad);color:var(--bad-d)}
.opt.bad .k{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.fb{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:540px;z-index:30;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.fb.ok{background:var(--ok-l);border-top:3px solid var(--ok)}
.fb.bad{background:var(--bad-l);border-top:3px solid var(--bad)}
.fb h3{font-size:21px;margin-bottom:4px}
.fb.ok h3{color:var(--ok-d)} .fb.bad h3{color:var(--bad-d)}
.fb .calc{font-weight:700;font-size:14px;margin-bottom:4px}
.fb .exp{font-size:14px;color:var(--ink2);margin-bottom:12px}

/* results */
.result{padding:40px 22px;text-align:center}
.result .st{font-size:40px;color:var(--gold-d);letter-spacing:6px}
.result h2{font-size:32px;margin:8px 0 4px}
.result .big{font-family:'Bricolage Grotesque',sans-serif;font-size:72px;font-weight:800;color:var(--accent);line-height:1;margin:14px 0 2px}
.result .lab{color:var(--ink2);font-size:14px}
.result .stats{margin:22px 0}
.badge{display:inline-block;background:var(--gold);color:#4a3300;font-weight:800;font-size:13px;border-radius:99px;padding:4px 12px;margin-top:6px}

/* boards, lists */
h2.pg{font-size:28px;margin:4px 0 4px}
.sub{color:var(--ink2);font-size:14px}
.pills{display:flex;gap:8px;margin:14px 0}
.pills button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink2)}
.pills button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lb li{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.lb li.me{border-color:var(--accent);background:var(--accent-l)}
.lb .rk{width:30px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;text-align:center}
.lb .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sc{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px}
.empty{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--ink2)}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:18px;margin-bottom:6px}
.optrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.optrow input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.q-item .qq{font-weight:700;margin:4px 0}
.q-item ul{margin:4px 0 0;padding-left:20px;font-size:14px;color:var(--ink2)}
.q-item li.c{color:var(--ok-d);font-weight:700}
.q-item .meta{font-size:12px;color:var(--ink2)}
pre.code{background:var(--ink);color:#e8eefc;border-radius:12px;padding:12px;font-size:12px;overflow:auto;white-space:pre-wrap}
details{margin:10px 0}
summary{cursor:pointer;font-weight:700;font-size:14px}
.errlist{font-size:13px;color:var(--bad-d);margin:8px 0;padding-left:18px}

/* profile */
.who{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.av{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;box-shadow:0 4px 0 var(--accent-d)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}

/* mind map */
.mm{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.mmtop{padding:14px 16px 6px}
.mmtitle{margin:14px 0 4px;font-size:24px}
.mmhelp{font-size:13px;color:var(--ink2)}
.mmstrip{min-height:28px;margin:8px 0 0;font-weight:700;font-size:14px}
.mmstrip.ok{color:var(--ok-d)} .mmstrip.bad{color:var(--bad-d)}
.mmrows{flex:1;padding:6px 16px 16px;display:flex;flex-direction:column;gap:10px}
.mmrow{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 10px 8px}
.mmrow.ok{border-color:var(--ok);background:#f6fcf8}
.mmrow.flash{animation:flash .5s}
@keyframes flash{0%,100%{border-color:var(--line)}30%{border-color:var(--bad);background:var(--bad-l)}}
.arr{color:var(--ink2);font-size:14px;text-align:center}
.mn{min-height:58px;border-radius:12px;border:2px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;justify-content:center;background:#fafcfe;min-width:0}
.mn b{font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.mn code{font-family:inherit;font-size:11px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.mn.hub{border-color:var(--gold-d);background:#fff8e3}
.mn.filled{border-color:var(--ok);background:var(--ok-l)}
.mn.blank{border-style:dashed;border-color:var(--ink2);background:#fff;align-items:center;font-size:24px;font-weight:800;color:var(--ink2);line-height:1}
.mn.blank small{font-size:11px;font-weight:500;margin-top:2px}
.mn.blank.sel{border-color:var(--accent);background:var(--accent-l);color:var(--accent-d);border-style:solid}
.mr{grid-column:1/-1;justify-self:center;margin-top:2px;max-width:100%}
.pill{display:inline-block;max-width:100%;background:var(--accent-l);color:var(--accent-d);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;border:2px solid transparent;text-align:center;overflow-wrap:anywhere}
.pill.filled{background:var(--ok-l);color:var(--ok-d)}
.pill.blank{background:#fff;border:2px dashed var(--ink2);color:var(--ink2)}
.pill.blank.sel{border:2px solid var(--accent);background:var(--accent-l);color:var(--accent-d)}
.chipbar{position:sticky;bottom:0;background:#fff;border-top:3px solid var(--line);padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:42vh;overflow:auto}
.chipbar .t{font-size:12px;color:var(--ink2);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:12px;padding:7px 11px;font-weight:700;font-size:13px;text-align:left;color:var(--ink)}
.chip.reagent{border-radius:99px;background:var(--accent-l);border-color:var(--accent-l);border-bottom-color:var(--accent);color:var(--accent-d)}
.chip.shake{animation:shake .4s;border-color:var(--bad)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* toasts / confirm */
#toasts{position:fixed;top:14px;left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:90vw;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad-d)} .toast.ok{background:var(--ok-d)}
.confirm{position:fixed;inset:0;background:rgba(21,33,59,.55);z-index:60;display:grid;place-items:center;padding:20px}
.confirm .box{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%}
.confirm h3{font-size:22px;margin-bottom:6px}
.confirm p{color:var(--ink2);margin-bottom:16px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink2);font-weight:700}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   BONDLY: biology and chemistry, one streak at a time
   Single file. Sections: 1 Storage, 2 Content, 3 Mind map data,
   4 State and scoring, 5 Screens, 6 Question bank, 7 Events
   ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

/* ---------------------------------------------------------------------
   1. STORAGE
   One small adapter. It uses the shared key-value store when the page runs
   inside Claude, localStorage when hosted elsewhere, and memory as a last
   resort. TO GO FULLY ONLINE (real global leaderboard + verified email
   login on your own domain), replace the four methods below with calls to
   Firebase / Supabase. Nothing else in the app needs to change.
   shared=true  -> visible to every player (leaderboard, question bank)
   shared=false -> private to this player (profile, progress, session)
   --------------------------------------------------------------------- */
const DB = {
  mode: 'memory', mem: new Map(),
  init() {
    if (window.storage && typeof window.storage.get === 'function') { this.mode = 'cloud'; return; }
    try { localStorage.setItem('__bondly', '1'); localStorage.removeItem('__bondly'); this.mode = 'local'; }
    catch (e) { this.mode = 'memory'; }
  },
  lk(key, shared) { return 'bondly:' + (shared ? 's:' : 'p:') + key; },
  async get(key, shared = false) {
    try {
      if (this.mode === 'cloud') { const r = await window.storage.get(key, shared); return r && r.value != null ? JSON.parse(r.value) : null; }
      const raw = this.mode === 'local' ? localStorage.getItem(this.lk(key, shared)) : this.mem.get(this.lk(key, shared));
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  async set(key, val, shared = false) {
    try {
      const raw = JSON.stringify(val);
      if (this.mode === 'cloud') { const r = await window.storage.set(key, raw, shared); return !!r; }
      if (this.mode === 'local') localStorage.setItem(this.lk(key, shared), raw); else this.mem.set(this.lk(key, shared), raw);
      return true;
    } catch (e) { return false; }
  },
  async del(key, shared = false) {
    try {
      if (this.mode === 'cloud') { await window.storage.delete(key, shared); return true; }
      if (this.mode === 'local') localStorage.removeItem(this.lk(key, shared)); else this.mem.delete(this.lk(key, shared));
      return true;
    } catch (e) { return false; }
  },
  async list(prefix, shared = false) {
    try {
      if (this.mode === 'cloud') { const r = await window.storage.list(prefix, shared); return (r && r.keys) || []; }
      const p = this.lk(prefix, shared), base = this.lk('', shared);
      const all = this.mode === 'local' ? Object.keys(localStorage) : [...this.mem.keys()];
      return all.filter(k => k.startsWith(p)).map(k => k.slice(base.length));
    } catch (e) { return []; }
  }
};

async function hashId(str) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('bondly:' + str));
    return [...new Uint8Array(buf)].slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { let h = 5381; for (const c of str) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16); }
}
const idOf = email => email.trim().toLowerCase().replace(/[^a-z0-9@._-]/g, '_');

/* ---------------------------------------------------------------------
   2. CONTENT
   Question format: [question, CORRECT, wrong, wrong, wrong, explanation]
   (options are shuffled each time a lesson starts)
   --------------------------------------------------------------------- */
const CUR = {

/* ---------------------------------------------------------------------
   4. STATE AND SCORING
   Points for a correct answer = answer speed x correct streak x accuracy
     speed    1-10  (10 = instant, falls to 1 as the time limit runs out)
     streak   correct answers in a row this run (resets on a miss)
     accuracy running share of answers correct this run (0-1)
   A wrong answer scores 0. Your leaderboard score is the sum of your
   best run on every lesson, so replaying can only improve it.
   --------------------------------------------------------------------- */
const TIME_LIMIT_Q = 20, TIME_LIMIT_MM = 25;
function calcPoints(t, limit, streak, correct, answered) {
  const speed = Math.max(1, Math.round(10 * (1 - t / limit)));
  const acc = answered ? correct / answered : 0;
  return { speed, streak, acc, pts: Math.max(1, Math.round(speed * streak * acc)) };
}

}

function pick(idx) {
  if (!G || G.kind !== 'mcq' || G.locked) return;
  G.locked = true;
  const q = G.qs[G.i], t = (performance.now() - G.t0) / 1000, ok = q.opts[idx] === q.a;
  G.answered++;
  const bar = document.querySelector('.tbar i'); if (bar) bar.style.animationPlayState = 'paused';
  document.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (q.opts[i] === q.a) b.classList.add('ok'); else if (i === idx) b.classList.add('bad'); else b.classList.add('dim'); });
  let head, calc = '';
  if (ok) {
    G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const sc = calcPoints(t, TIME_LIMIT_Q, G.streak, G.correct, G.answered); G.score += sc.pts;
    head = `Correct, +${sc.pts}`; calc = `⚡ speed ${sc.speed} × 🔥 streak ${sc.streak} × 🎯 accuracy ${sc.acc.toFixed(2)}`;
  } else { G.streak = 0; head = 'Not quite'; calc = 'Streak reset. No points this time.'; }
  const last = G.i === G.qs.length - 1;
  const fb = $('#fb'); fb.hidden = false; fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  fb.innerHTML = `<h3>${head}</h3><div class="calc">${calc}</div><div class="exp">${ok ? '' : `Answer: ${esc(q.a)}. `}${esc(q.exp)}</div><button class="btn ${ok ? 'ok' : 'bad'}" data-act="next" id="nextBtn">${last ? 'Finish lesson' : 'Continue'}</button>`;

}

/* ---- mind map challenge ---- */
function buildMM(id) {
  const L = MM_LEVELS.find(l => l.id === id);
  const eids = L.boss ? shuffle(Object.keys(ME)).slice(0, 10) : L.edges;
  const rows = eids.map(eid => {
    const [A, B, R] = ME[eid];
    const anchor = (L.center && B === L.center && A !== L.center) ? 'B' : 'A';
    return { eid, A, B, R, anchor, nodeKey: anchor === 'A' ? B : A, blank: Math.random() < 0.5 ? 'reagent' : 'node', done: false };
  });
  if (rows.every(r => r.blank === rows[0].blank)) rows[0].blank = rows[0].blank === 'node' ? 'reagent' : 'node';
  const ans = r => r.blank === 'reagent' ? r.R : MN[r.nodeKey][0];
  const chips = rows.map((r, i) => ({ id: 'c' + i, type: r.blank, text: ans(r), used: false }));
  const usedR = new Set(rows.map(r => r.R)), usedN = new Set(rows.flatMap(r => [r.A, r.B]));
  const rPool = shuffle([...new Set(Object.values(ME).map(e => e[2]))].filter(t => !usedR.has(t)));
  const nPool = shuffle(Object.keys(MN).filter(k => !usedN.has(k))).map(k => MN[k][0]);
  if (rows.some(r => r.blank === 'reagent')) rPool.slice(0, 2).forEach((t, i) => chips.push({ id: 'dr' + i, type: 'reagent', text: t, used: false }));
  if (rows.some(r => r.blank === 'node')) nPool.slice(0, 2).forEach((t, i) => chips.push({ id: 'dn' + i, type: 'node', text: t, used: false }));
  return { kind: 'mm', id, center: L.center, rows, chips: shuffle(chips), sel: 0, correct: 0, answered: 0, streak: 0, bestStreak: 0, score: 0, t0: performance.now(), started: Date.now(), msg: null, shake: null, flash: null, ans };
}
function startMM(id) { G = buildMM(id); S.sheet = null; S.screen = 'mm'; render(); }
function mmNode(key, o) {
  const [name, f] = MN[key];
  if (o.blank && !o.done) return `<button class="mn blank ${o.sel ? 'sel' : ''}" data-act="mmsel" data-row="${o.idx}" aria-label="Missing compound">?<small>compound</small></button>`;
  return `<div class="mn ${o.done ? 'filled' : ''} ${key === G.center ? 'hub' : ''}"><b>${key === G.center ? '★ ' : ''}${esc(name)}</b><code>${esc(f)}</code></div>`;
}
function mmRow(r, i) {
  const sel = G.sel === i && !r.done;
  const a = (r.blank === 'node' && r.anchor === 'B') ? mmNode(r.A, { blank: true, sel, done: r.done, idx: i }) : mmNode(r.A, {});
  const b = (r.blank === 'node' && r.anchor === 'A') ? mmNode(r.B, { blank: true, sel, done: r.done, idx: i }) : mmNode(r.B, {});
  const re = r.blank === 'reagent'
    ? (r.done ? `<span class="pill filled">${esc(r.R)}</span>` : `<button class="pill blank ${sel ? 'sel' : ''}" data-act="mmsel" data-row="${i}" aria-label="Missing reagent">reagent or conditions ?</button>`)
    : `<span class="pill">${esc(r.R)}</span>`;
  return `<div class="mmrow ${r.done ? 'ok' : ''} ${G.flash === i ? 'flash' : ''}">${a}<span class="arr" aria-hidden="true">▶</span>${b}<div class="mr">${re}</div></div>`;
}
function renderMM() {
  const L = LESSONS[G.id], done = G.rows.filter(r => r.done).length, pct = Math.round(done / G.rows.length * 100);
  const strip = G.msg ? `<div class="mmstrip ${G.msg.ok === true ? 'ok' : G.msg.ok === false ? 'bad' : ''}">${G.msg.html}</div>` : '<div class="mmstrip"></div>';
  const chips = G.chips.filter(c => !c.used).map(c => `<button class="chip ${c.type} ${G.shake === c.id ? 'shake' : ''}" data-act="mmchip" data-chip="${c.id}">${esc(c.text)}</button>`).join('');
  const html = `<div class="mm"><div class="mmtop">
      <div class="ptop"><button class="x" data-act="quit" aria-label="Leave challenge">✕</button><div class="spectrum" role="progressbar" aria-valuenow="${pct}"><div class="cover" style="width:${100 - pct}%"></div></div>${liveHTML()}</div>
      <h2 class="mmtitle disp">${L.icon} ${esc(L.title)}</h2>
      <div class="mmhelp">Arrows read left to right. Tap a ? to pick a slot, then tap the answer below.</div>${strip}</div>
    <div class="mmrows">${G.rows.map(mmRow).join('')}</div>
    <div class="chipbar"><div class="t">Answer bank (${G.chips.filter(c => !c.used && !c.id.startsWith('d')).length} to place, plus a few decoys)</div><div class="chips">${chips}</div></div></div>`;
  G.shake = null; G.flash = null;
  $('#app').innerHTML = html;
}
function mmPlace(chipId) {
  const ch = G.chips.find(c => c.id === chipId); if (!ch || ch.used) return;
  let r = G.rows[G.sel]; if (!r || r.done) { G.sel = G.rows.findIndex(x => !x.done); r = G.rows[G.sel]; }
  if (ch.type !== r.blank) { G.msg = { ok: null, html: r.blank === 'reagent' ? 'This slot needs a reagent or conditions.' : 'This slot needs a compound.' }; G.shake = ch.id; return renderMM(); }
  const t = (performance.now() - G.t0) / 1000; G.t0 = performance.now(); G.answered++;
  if (ch.text === G.ans(r)) {
    G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
    const sc = calcPoints(t, TIME_LIMIT_MM, G.streak, G.correct, G.answered); G.score += sc.pts;
    r.done = true; ch.used = true;
    G.msg = { ok: true, html: `+${sc.pts} &nbsp; ⚡${sc.speed} × 🔥${sc.streak} × 🎯${sc.acc.toFixed(2)}` };
    G.sel = G.rows.findIndex(x => !x.done);
    if (G.sel === -1) { G.sel = 0; renderMM(); return setTimeout(finishRun, 700); }
  } else {
    G.streak = 0; G.shake = ch.id; G.flash = G.sel; G.msg = { ok: false, html: 'Not that one. Streak reset, try another.' };
  }
  renderMM();
}

/* ---- finish and results ---- */
async function finishRun() {
  const acc = G.answered ? G.correct / G.answered : 0, stars = acc >= .9 ? 3 : acc >= .7 ? 2 : 1;
  const prev = S.user.progress[G.id] || { best: 0, plays: 0 };
  const isBest = G.score > (prev.best || 0);
  S.user.progress[G.id] = { best: Math.max(prev.best || 0, G.score), stars: Math.max(prev.stars || 0, stars), bestStreak: Math.max(prev.bestStreak || 0, G.bestStreak), done: true, plays: (prev.plays || 0) + 1 };
  const L = LESSONS[G.id]; S.subject = L.subject; S.sem[L.subject] = L.sem; S.tab = 'learn';
  S.result = { id: G.id, score: G.score, acc, streak: G.bestStreak, time: Math.round((Date.now() - G.started) / 1000), stars, isBest, first: !prev.plays, rank: null };
  G = null; S.screen = 'result'; render();
  await saveUser(); await pushScore(); await loadBoard();
  if (S.screen === 'result' && S.result) { S.result.rank = rankOf('total'); render(); }
}
function resultHTML() {
  const R = S.result, L = LESSONS[R.id];
  const head = R.stars === 3 ? 'Flawless' : R.stars === 2 ? 'Solid run' : 'Lesson complete';
  return `<div class="result"><div class="st" aria-label="${R.stars} of 3 stars">${'★'.repeat(R.stars)}${'☆'.repeat(3 - R.stars)}</div>
    <h2>${head}</h2><div class="lab">${esc(L.title)}</div>
    <div class="big">${R.score}</div><div class="lab">points this run</div>
    ${R.isBest && !R.first ? '<span class="badge">New personal best</span>' : ''}
    <div class="stats"><div class="stat"><b>${Math.round(R.acc * 100)}%</b><span>Accuracy</span></div><div class="stat"><b>${R.streak}</b><span>Best streak</span></div><div class="stat"><b>${R.time}s</b><span>Time</span></div></div>
    ${R.rank ? `<p class="sub" style="margin-bottom:16px">You are #${R.rank} overall with ${totals().total} points.</p>` : '<p class="sub" style="margin-bottom:16px">Updating leaderboard…</p>'}
    <div class="row"><button class="btn ghost" data-act="again" data-id="${R.id}">Play again</button><button class="btn" data-act="home">Continue</button></div></div>`;
}
function confirmQuit() {
  const d = document.createElement('div'); d.className = 'confirm'; d.id = 'confirm';
  d.innerHTML = `<div class="box"><h3>Leave this run?</h3><p>Your points from this run will not be saved.</p><div class="row"><button class="btn ghost" data-act="stay">Keep going</button><button class="btn bad" data-act="leave">Leave</button></div></div>`;
  document.body.appendChild(d);
}

/* ---------------------------------------------------------------------
   6. QUESTION BANK (add, bulk upload, browse)
   --------------------------------------------------------------------- */
function unitOptions(sel) {
  return ['chem', 'bio'].map(sk => CUR[sk].sems.map((s, si) => `<optgroup label="${CUR[sk].name}, semester ${si + 1}: ${esc(s.title)}">${s.units.map(u => `<option value="${u[0]}" ${sel === u[0] ? 'selected' : ''}>${esc(u[1])}</option>`).join('')}</optgroup>`).join('')).join('');
}
function bankHTML() {
  const tabs = [['add', 'Add one'], ['bulk', 'Upload file'], ['browse', 'Browse']];
  const t = S.bankTab;
  let body = '';
  if (t === 'add') body = `<div class="card"><label class="f" for="f-unit" style="margin-top:0">Where does it belong?</label><select id="f-unit">${unitOptions(S.bankUnit)}</select>
      <label class="f" for="f-q">Question</label><textarea id="f-q" maxlength="300" placeholder="Write the question"></textarea>
      <label class="f">Options <small>(select the correct one)</small></label>
      ${[0, 1, 2, 3].map(i => `<div class="optrow"><input type="radio" name="correct" value="${i}" ${i === 0 ? 'checked' : ''} aria-label="Option ${'ABCD'[i]} is correct"><input type="text" id="f-o${i}" maxlength="120" placeholder="Option ${'ABCD'[i]}"></div>`).join('')}
      <label class="f" for="f-exp">Explanation <small>(optional, shown after answering)</small></label><textarea id="f-exp" maxlength="300" style="min-height:64px"></textarea>
      <div style="margin-top:14px"><button class="btn" data-act="submitQ">Add to question bank</button></div></div>
      <p class="fine">Approved instantly and visible to every player in the lessons for that unit. You can delete your own questions under Browse.</p>`;
  else if (t === 'bulk') {
    const b = S.bulk;
    body = `<div class="card"><label class="f" for="b-unit" style="margin-top:0">Add all questions to</label><select id="b-unit">${unitOptions(S.bankUnit)}</select>
      <label class="f" for="bulkfile">CSV or JSON file <small>(up to 100 questions, 300 KB)</small></label><input id="bulkfile" type="file" accept=".csv,.json,text/csv,application/json" style="width:100%">
      ${b ? `<div style="margin-top:12px"><b>${esc(b.name)}</b>: ${b.valid.length} ready${b.errors.length ? `, ${b.errors.length} skipped` : ''}.${b.errors.length ? `<ul class="errlist">${b.errors.slice(0, 6).map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}</div>${b.valid.length ? `<div style="margin-top:10px"><button class="btn" data-act="uploadBulk">Upload ${b.valid.length} question${b.valid.length > 1 ? 's' : ''}</button></div>` : ''}` : ''}</div>
      <div class="card"><h3>File format</h3><p class="sub">CSV columns: question, A, B, C, D, answer (A to D), explanation. JSON: a list of objects with question, options (4 items), answer ("A" to "D" or the exact option text) and explanation.</p>
      <div style="margin:10px 0"><button class="btn small ghost" data-act="template">Download CSV template</button></div>
      <details><summary>See an example</summary><pre class="code">question,A,B,C,D,answer,explanation
"Which organelle makes ATP?","Mitochondrion","Ribosome","Golgi body","Nucleus","A","Mitochondria carry out aerobic respiration."</pre></details></div>`;
  } else {
    const list = S.community.filter(c => S.browseUnit === 'all' || c.unit === S.browseUnit).slice().reverse().slice(0, 100);
    body = `<label class="f" for="br-unit" style="margin-top:0">Show questions for</label><select id="br-unit"><option value="all">All units (${S.community.length})</option>${unitOptions(S.browseUnit)}</select><div style="height:12px"></div>
      ${list.length ? list.map(c => `<div class="card q-item"><div class="meta">${esc(LESSONS[c.unit].title)} · by ${esc(String(c.by || 'a player').slice(0, 20))}</div><div class="qq">${esc(String(c.q).slice(0, 300))}</div><ul>${c.opts.map((o, i) => `<li class="${i === c.c ? 'c' : ''}">${esc(String(o).slice(0, 120))}</li>`).join('')}</ul>${c.pid === S.user.pid ? `<div style="margin-top:10px"><button class="btn small ghost" data-act="delq" data-id="${esc(c.id)}">Delete</button></div>` : ''}</div>`).join('') : '<div class="empty">No community questions here yet. Add the first one.</div>'}`;
  }
  return `<h2 class="pg">Question bank</h2><p class="sub">${S.community.length} community question${S.community.length === 1 ? '' : 's'} mixed into lessons.</p>
    <div class="pills">${tabs.map(x => `<button class="${t === x[0] ? 'on' : ''}" data-act="bankTab" data-t="${x[0]}">${x[1]}</button>`).join('')}</div>${body}`;
}
function validateQ({ q, opts, exp }) {
  if (q.length < 10) return 'The question needs at least 10 characters.';
  if (q.length > 300) return 'The question is over 300 characters.';
  if (!Array.isArray(opts) || opts.length !== 4) return 'Each question needs exactly 4 options.';
  if (opts.some(o => !o)) return 'Fill in all four options.';
  if (opts.some(o => o.length > 120)) return 'Options are limited to 120 characters.';
  if (new Set(opts.map(o => o.toLowerCase())).size !== 4) return 'The four options must be different.';
  if ((exp || '').length > 300) return 'The explanation is over 300 characters.';
  return '';
}
const norm = s => String(s).toLowerCase().replace(/\s+/g, ' ').trim();
function makeRec(unit, q, opts, c, exp) {
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), unit, q, opts, c, exp: exp || '', by: S.user.name, pid: S.user.pid, ts: Date.now() };
}
const isDupe = (unit, q) => S.community.some(c => c.unit === unit && norm(c.q) === norm(q)) || (QUESTIONS[unit] || []).some(x => norm(x[0]) === norm(q));
async function saveRecs(recs) {
  let ok = 0;
  for (let i = 0; i < recs.length; i += 10) {
    const res = await Promise.all(recs.slice(i, i + 10).map(r => DB.set('cq:' + r.id, r, true)));
    res.forEach((v, j) => { if (v) { S.community.push(recs[i + j]); ok++; } });
  }
  return ok;
}
async function submitQ() {
  const unit = $('#f-unit').value, q = $('#f-q').value.trim(), opts = [0, 1, 2, 3].map(i => $('#f-o' + i).value.trim());
  const c = +((document.querySelector('input[name=correct]:checked') || { value: 0 }).value), exp = $('#f-exp').value.trim();
  const err = validateQ({ q, opts, exp }); if (err) return toast(err, 'bad');
  if (isDupe(unit, q)) return toast('That question is already in this unit.', 'bad');
  S.bankUnit = unit;
  const n = await saveRecs([makeRec(unit, q, opts, c, exp)]);
  if (n) { toast('Question added to the bank.', 'ok'); render(); } else toast('Could not save. Try again.', 'bad');
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; } else cell += c; }
    else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
function toIndex(a, opts) {
  const s = String(a ?? '').trim();
  if (/^[A-D]$/i.test(s)) return s.toUpperCase().charCodeAt(0) - 65;
  if (/^[1-4]$/.test(s)) return +s - 1;
  return opts.findIndex(o => o.toLowerCase() === s.toLowerCase());
}
async function handleFile(file) {
  if (!file) return;
  if (file.size > 300000) return toast('File is too large (max 300 KB).', 'bad');
  const text = (await file.text()).replace(/^\uFEFF/, ''); let rows = [];
  try {
    const tr = text.trim();
    if (/\.json$/i.test(file.name) || tr.startsWith('[') || tr.startsWith('{')) {
      let data = JSON.parse(tr); if (!Array.isArray(data)) data = data.questions || [];
      rows = data.map(o => ({ q: o.question ?? o.q, opts: o.options ?? o.opts, ans: o.answer ?? o.correct, exp: o.explanation ?? o.exp ?? '' }));
    } else {
      const t = parseCSV(text); if (t.length && /question/i.test(t[0][0])) t.shift();
      rows = t.map(r => ({ q: r[0], opts: [r[1], r[2], r[3], r[4]], ans: r[5], exp: r[6] || '' }));
    }
  } catch (e) { return toast('Could not read that file. Check the format.', 'bad'); }
  const valid = [], errors = [];
  rows.slice(0, 100).forEach((r, i) => {
    const q = String(r.q ?? '').trim(), exp = String(r.exp ?? '').trim(), opts = (Array.isArray(r.opts) ? r.opts : []).map(x => String(x ?? '').trim());
    const err = validateQ({ q, opts, exp }), c = err ? -1 : toIndex(r.ans, opts);
    if (err) errors.push(`Row ${i + 1}: ${err}`); else if (c < 0) errors.push(`Row ${i + 1}: answer must be A, B, C or D.`); else valid.push({ q, opts, c, exp });
  });
  if (rows.length > 100) errors.push('Only the first 100 rows are used.');
  S.bulk = { name: file.name, valid, errors }; render();
}
async function uploadBulk() {
  if (!S.bulk) return;
  const unit = S.bankUnit, seen = new Set(), recs = [];
  for (const v of S.bulk.valid) { const k = norm(v.q); if (seen.has(k) || isDupe(unit, v.q)) continue; seen.add(k); recs.push(makeRec(unit, v.q, v.opts, v.c, v.exp)); }
  const skipped = S.bulk.valid.length - recs.length;
  const n = await saveRecs(recs); S.bulk = null;
  toast(`${n} question${n === 1 ? '' : 's'} added${skipped ? `, ${skipped} duplicate${skipped > 1 ? 's' : ''} skipped` : ''}.`, n ? 'ok' : 'bad'); render();
}
function downloadTemplate() {
  const csv = 'question,A,B,C,D,answer,explanation\n"Which organelle makes ATP?","Mitochondrion","Ribosome","Golgi body","Nucleus","A","Mitochondria carry out aerobic respiration."\n';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'bondly-question-template.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------------------------------------------------------------------
   7. EVENTS AND START-UP
   --------------------------------------------------------------------- */
async function doLogin() {
  const err = m => { $('#loginErr').textContent = m; };
  const email = $('#email').value.trim().toLowerCase(), name = $('#name').value.trim().slice(0, 20);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return err('Enter a valid email address.');
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…'; err('');
  const id = idOf(email); let u = await DB.get('user:' + id, false);
  if (!u) {
    if (name.length < 2) { btn.disabled = false; btn.textContent = 'Save my progress'; return err('New here? Choose a display name of at least 2 characters.'); }
    u = { id, email, name, pid: await hashId(email), progress: {}, created: Date.now() };
  } else { if (name.length >= 2) u.name = name; if (!u.pid) u.pid = await hashId(email); }
  S.user = u; await saveUser(); await DB.set('session', { id }, false);
  await Promise.all([loadBoard(), loadCommunity()]);
  await pushScore();
  S.screen = 'main'; S.tab = 'learn'; render();
}

const ACT = {
  login: doLogin,
  tab: el => { S.tab = el.dataset.tab; S.sheet = null; render(); if (S.tab === 'board') refreshBoard(); if (S.tab === 'bank') loadCommunity().then(() => { if (S.screen === 'main' && S.tab === 'bank' && S.bankTab === 'browse') render(); }); },
  subject: el => { S.subject = el.dataset.s; render(); },
  sem: el => { S.sem[S.subject] = +el.dataset.i; render(); },
  open: el => {
    const id = el.dataset.id, L = LESSONS[id], sec = sections(L.subject, L.sem).find(s => s.ids.includes(id)), i = sec.ids.indexOf(id);
    if (!unlocked(sec, i)) return toast('Finish the previous step to unlock this one.', 'bad');
    S.sheet = id; render();
  },
  overlay: (el, e) => { if (e.target === el) { S.sheet = null; render(); } },
  closeSheet: () => { S.sheet = null; render(); },
  start: el => { const id = el.dataset.id; LESSONS[id].kind === 'mm' ? startMM(id) : startMCQ(id); },
  again: el => { const id = el.dataset.id; S.result = null; LESSONS[id].kind === 'mm' ? startMM(id) : startMCQ(id); },
  home: () => { S.result = null; S.screen = 'main'; S.tab = 'learn'; render(); },
  pick: el => pick(+el.dataset.i),
  next: nextQ,
  quit: confirmQuit,
  stay: () => { const c = $('#confirm'); if (c) c.remove(); },
  leave: () => { const c = $('#confirm'); if (c) c.remove(); G = null; S.screen = 'main'; render(); },
  mmsel: el => { const i = +el.dataset.row; if (G && G.rows[i] && !G.rows[i].done) { G.sel = i; G.msg = null; renderMM(); } },
  mmchip: el => mmPlace(el.dataset.chip),
  boardFilter: el => { S.boardFilter = el.dataset.f; render(); },
  refreshBoard: () => refreshBoard(true),
  bankTab: el => { S.bankTab = el.dataset.t; S.bulk = null; render(); },
  submitQ, uploadBulk, template: downloadTemplate,
  delq: async el => {
    const id = el.dataset.id, rec = S.community.find(c => c.id === id);
    if (!rec || rec.pid !== S.user.pid) return;
    await DB.del('cq:' + id, true); S.community = S.community.filter(c => c.id !== id); toast('Question deleted.', 'ok'); render();
  },
  signout: async () => { await DB.del('session', false); S.user = null; S.screen = 'login'; S.sheet = null; render(); }
};
async function refreshBoard(show) {
  await loadBoard();
  if (S.screen === 'main' && S.tab === 'board') { render(); if (show) toast('Leaderboard updated.', 'ok'); }
}

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'bulkfile') handleFile(t.files[0]);
  else if (t.id === 'f-unit' || t.id === 'b-unit') S.bankUnit = t.value;
  else if (t.id === 'br-unit') { S.browseUnit = t.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) { if (e.key === 'Enter' && S.screen === 'login' && e.target.matches('input')) doLogin(); return; }
  if (S.screen !== 'play' || !G) return;
  const k = e.key.toLowerCase();
  if (!G.locked) { const i = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k); if (k.length === 1 && i >= 0) pick(i); }
  else if (e.key === 'Enter') { e.preventDefault(); nextQ(); }
});

(async function init() {
  render();
  DB.init();
  const sess = await DB.get('session', false);
  if (sess && sess.id) {
    const u = await DB.get('user:' + sess.id, false);
    if (u) { if (!u.pid) u.pid = await hashId(u.email); S.user = u; await Promise.all([loadBoard(), loadCommunity()]); S.screen = 'main'; }
  }
  S.ready = true; render();
})();
</script>
