<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemLingo - Chemical Reactions</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDKs for Live Leaderboard -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #131f24; color: white; }
    .duo-btn {
      box-shadow: 0 4px 0 #46a302;
      transition: all 0.1s ease;
    }
    .duo-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #46a302;
    }
    .option-btn {
      box-shadow: 0 4px 0 #37464f;
    }
    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #37464f;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between max-w-md mx-auto border-x border-gray-800">

  <!-- TOP BAR -->
  <div class="p-4 flex justify-between items-center border-b border-gray-800 bg-[#131f24] sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-[#58cc02] fa-fire text-amber-500 text-xl"></i>
      <span id="score-display" class="font-bold text-amber-500 text-lg">0 XP</span>
    </div>
    <!-- Progress Bar -->
    <div class="w-1/2 bg-gray-700 h-4 rounded-full overflow-hidden">
      <div id="progress-bar" class="bg-[#58cc02] h-full w-0 transition-all duration-300"></div>
    </div>
    <div class="flex items-center gap-1">
      <i class="fa-solid fa-heart text-red-500 text-xl"></i>
      <span id="lives-display" class="font-bold text-red-500 text-lg">3</span>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="p-5 flex-1 flex flex-col justify-center">

    <!-- START / USERNAME SCREEN -->
    <div id="start-screen" class="text-center space-y-6">
      <div class="text-6xl text-[#58cc02]"><i class="fa-solid fa-[#58cc02] fa-[#58cc02] fa-flask"></i></div>
      <h1 class="text-3xl font-extrabold text-white">ChemLingo</h1>
      <p class="text-gray-400">Master Period 3, Group 2, and Halide chemical reactions!</p>
      
      <input type="text" id="username-input" placeholder="Enter your username" 
        class="w-full p-4 rounded-xl bg-gray-800 border-2 border-gray-700 text-white font-bold focus:outline-none focus:border-[#58cc02] text-center">
      
      <button onclick="startGame()" class="duo-btn w-full bg-[#58cc02] hover:bg-[#46a302] text-white font-bold py-4 rounded-xl uppercase tracking-wider text-lg">
        Start Practicing
      </button>

      <button onclick="showLeaderboard()" class="w-full bg-gray-800 border-2 border-gray-700 text-gray-300 font-bold py-3 rounded-xl uppercase tracking-wider text-sm mt-2">
        <i class="fa-solid fa-trophy text-amber-400 mr-2"></i> View Global Leaderboard
      </button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden flex-col justify-between flex-1">
      <div>
        <span id="category-badge" class="bg-gray-800 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full text-[#58cc02]">
          Category
        </span>
        <h2 id="question-text" class="text-xl font-bold mt-4 mb-6 text-white leading-relaxed">
          Question goes here?
        </h2>

        <div id="options-container" class="space-y-3">
          <!-- Dynamic Options -->
        </div>
      </div>

      <!-- FEEDBACK BAR -->
      <div id="feedback-card" class="hidden rounded-xl p-4 mt-6">
        <div class="flex items-center gap-3 mb-2">
          <i id="feedback-icon" class="text-2xl"></i>
          <span id="feedback-title" class="font-bold text-lg"></span>
        </div>
        <p id="feedback-detail" class="text-sm font-medium mb-4"></p>
        <button id="next-btn" onclick="nextQuestion()" class="w-full py-3 rounded-xl font-bold text-white uppercase tracking-wider">
          Continue
        </button>
      </div>
    </div>

    <!-- LEADERBOARD SCREEN -->
    <div id="leaderboard-screen" class="hidden space-y-4">
      <h2 class="text-2xl font-extrabold text-center text-amber-400"><i class="fa-solid fa-trophy mr-2"></i> Leaderboard</h2>
      <div id="leaderboard-list" class="space-y-2 max-h-80 overflow-y-auto">
        <!-- Live Leaderboard items -->
      </div>
      <button onclick="restartApp()" class="duo-btn w-full bg-[#58cc02] text-white font-bold py-3 rounded-xl uppercase">
        Back to Menu
      </button>
    </div>

  </main>

  <!-- JAVASCRIPT & REACTION DATASET -->
  <script>
    // 1. DATASET FROM YOUR IMAGE
    const reactionsData = [
      {
        question: "Complete the Period 3 oxide reaction: 4Na + O₂ ➔ ?",
        options: ["2Na₂O", "Na₂O₂", "2NaO", "Na₂O₃"],
        answer: "2Na₂O",
        category: "Period 3 Oxygen"
      },
      {
        question: "What is formed when Sodium reacts with excess Oxygen to form peroxide?",
        options: ["2Na + O₂ ➔ Na₂O₂", "4Na + O₂ ➔ 2Na₂O", "Na + O₂ ➔ NaO₂", "2Na + 2O₂ ➔ Na₂O₄"],
        answer: "2Na + O₂ ➔ Na₂O₂",
        category: "Period 3 Oxygen"
      },
      {
        question: "Reaction of Sodium Peroxide with COLD water: Na₂O₂ + H₂O ➔ 2NaOH + ?",
        options: ["H₂O₂", "O₂", "H₂", "NaOH"],
        answer: "H₂O₂",
        category: "Period 3 Water"
      },
      {
        question: "Reaction of Sodium Peroxide with HOT water: Na₂O₂ + H₂O ➔ 2NaOH + ?",
        options: ["O₂", "H₂O₂", "H₂", "Na₂O"],
        answer: "O₂",
        category: "Period 3 Water"
      },
      {
        question: "What amphoteric product forms when Al₂O₃ reacts with NaOH?",
        options: ["2NaAl(OH)₄", "Na₂AlO₂ + H₂O", "Al(OH)₃ + 2NaCl", "Na₂SO₄"],
        answer: "2NaAl(OH)₄",
        category: "Period 3 Acid/Base"
      },
      {
        question: "What is the product of Cl₂ + 2NaOH (COLD)?",
        options: ["NaCl + NaClO + H₂O", "5NaCl + NaClO₃ + 3H₂O", "NaCl + HClO", "NaClO₃ + H₂"],
        answer: "NaCl + NaClO + H₂O",
        category: "Group 17"
      },
      {
        question: "What is the product of 3Cl₂ + 6NaOH (HOT)?",
        options: ["5NaCl + NaClO₃ + 3H₂O", "NaCl + NaClO + H₂O", "3NaCl + 3HClO", "NaClO₄ + 3H₂"],
        answer: "5NaCl + NaClO₃ + 3H₂O",
        category: "Group 17"
      },
      {
        question: "What precipitate color is formed when Ag⁺ reacts with I⁻?",
        options: ["AgI (yellow)", "AgCl (white)", "AgBr (cream)", "Ag₂O (black)"],
        answer: "AgI (yellow)",
        category: "Halides Test"
      },
      {
        question: "Complete the redox reaction: 2HBr + H₂SO₄ ➔ ?",
        options: ["Br₂ (reddish brown) + SO₂ + 2H₂O", "KHSO₄ + HBr", "Br₂ + H₂S + H₂O", "SO₃ + 2HBr"],
        answer: "Br₂ (reddish brown) + SO₂ + 2H₂O",
        category: "Halides with H₂SO₄"
      },
      {
        question: "Complete the reaction: 2HI + H₂SO₄ ➔ ?",
        options: ["I₂ (violet) + SO₂ + 2H₂O", "KHSO₄ + HI", "I₂ + H₂S + H₂O", "2H₂O + SO₃"],
        answer: "I₂ (violet) + SO₂ + 2H₂O",
        category: "Halides with H₂SO₄"
      },
      {
        question: "What reaction occurs between Magnesium and STEAM?",
        options: ["Mg + H₂O ➔ MgO + H₂", "Mg + 2H₂O ➔ Mg(OH)₂ + H₂", "No reaction occurs", "Mg + H₂O ➔ Mg(OH)₂"],
        answer: "Mg + H₂O ➔ MgO + H₂",
        category: "Group 2"
      },
      {
        question: "What forms when Lead(IV) Oxide reacts with HOT concentrated HCl?",
        options: ["PbCl₂ + Cl₂ + 2H₂O", "PbCl₄ + 2H₂O", "PbO + Cl₂", "PbCl₂ + H₂O"],
        answer: "PbCl₂ + Cl₂ + 2H₂O",
        category: "Group 14"
      }
    ];

    // 2. APP STATE
    let currentIdx = 0;
    let score = 0;
    let lives = 3;
    let username = "Player";

    // 3. FIREBASE CONFIGURATION (Public Demo Firestore DB for Leaderboard)
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyForLingoChem123456",
      projectId: "chemlingo-leaderboard",
      firestoreDatabaseUrl: "https://chemlingo-leaderboard.firebaseio.com"
    };
    
    // Fallback Local Leaderboard if offline or setup absent
    let localLeaderboard = [
      { name: "ChemPro", score: 100 },
      { name: "AtomMaster", score: 80 },
      { name: "ReactUser", score: 50 }
    ];

    function startGame() {
      const input = document.getElementById("username-input").value.trim();
      if(input) username = input;
      
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      document.getElementById("quiz-screen").classList.add("flex");
      
      currentIdx = 0;
      score = 0;
      lives = 3;
      updateHeader();
      loadQuestion();
    }

    function updateHeader() {
      document.getElementById("score-display").innerText = `${score} XP`;
      document.getElementById("lives-display").innerText = lives;
      const progressPercent = ((currentIdx) / reactionsData.length) * 100;
      document.getElementById("progress-bar").style.width = `${progressPercent}%`;
    }

    function loadQuestion() {
      if (currentIdx >= reactionsData.length || lives <= 0) {
        finishGame();
        return;
      }

      const q = reactionsData[currentIdx];
      document.getElementById("category-badge").innerText = q.category;
      document.getElementById("question-text").innerText = q.question;
      document.getElementById("feedback-card").classList.add("hidden");

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      // Shuffle options
      const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn w-full bg-gray-800 border-2 border-gray-700 text-white font-semibold py-4 px-4 rounded-xl text-left hover:border-gray-500 transition";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, q.answer, btn);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct, selectedBtn) {
      // Disable all option buttons
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(b => b.disabled = true);

      const feedbackCard = document.getElementById("feedback-card");
      const feedbackTitle = document.getElementById("feedback-title");
      const feedbackDetail = document.getElementById("feedback-detail");
      const feedbackIcon = document.getElementById("feedback-icon");
      const nextBtn = document.getElementById("next-btn");

      feedbackCard.classList.remove("hidden");

      if (selected === correct) {
        score += 10;
        selectedBtn.classList.add("bg-green-900/50", "border-[#58cc02]");
        feedbackCard.className = "rounded-xl p-4 mt-6 bg-[#20380a] border border-[#58cc02]";
        feedbackIcon.className = "fa-solid fa-circle-check text-[#58cc02] text-2xl";
        feedbackTitle.className = "font-bold text-lg text-[#58cc02]";
        feedbackTitle.innerText = "Excellent!";
        feedbackDetail.innerText = "+10 XP Earned";
        nextBtn.className = "w-full py-3 rounded-xl font-bold text-white uppercase tracking-wider bg-[#58cc02]";
      } else {
        lives--;
        selectedBtn.classList.add("bg-red-900/50", "border-red-500");
        feedbackCard.className = "rounded-xl p-4 mt-6 bg-[#37191e] border border-red-500";
        feedbackIcon.className = "fa-solid fa-circle-xmark text-red-500 text-2xl";
        feedbackTitle.className = "font-bold text-lg text-red-500";
        feedbackTitle.innerText = "Incorrect!";
        feedbackDetail.innerText = `Correct Answer: ${correct}`;
        nextBtn.className = "w-full py-3 rounded-xl font-bold text-white uppercase tracking-wider bg-red-500";
      }

      updateHeader();
    }

    function nextQuestion() {
      currentIdx++;
      loadQuestion();
    }

    function finishGame() {
      // Add score to leaderboard
      localLeaderboard.push({ name: username, score: score });
      localLeaderboard.sort((a, b) => b.score - a.score);

      showLeaderboard();
    }

    function showLeaderboard() {
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("flex");
      document.getElementById("leaderboard-screen").classList.remove("hidden");

      const list = document.getElementById("leaderboard-list");
      list.innerHTML = "";

      localLeaderboard.slice(0, 10).forEach((entry, rank) => {
        const item = document.createElement("div");
        item.className = `flex justify-between items-center p-3 rounded-xl border ${
          entry.name === username ? "bg-[#20380a] border-[#58cc02]" : "bg-gray-800 border-gray-700"
        }`;
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="font-bold text-gray-400 w-6">#${rank + 1}</span>
            <span class="font-bold text-white">${entry.name}</span>
          </div>
          <span class="font-bold text-amber-400">${entry.score} XP</span>
        `;
        list.appendChild(item);
      });
    }

    function restartApp() {
      document.getElementById("leaderboard-screen").classList.add("hidden");
      document.getElementById("start-screen").classList.remove("hidden");
    }
  </script>
</body>
</html>
