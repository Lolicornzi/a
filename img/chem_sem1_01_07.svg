<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <style>
    .axis { stroke: black; stroke-width: 1.5; }
    .peak { stroke: black; stroke-width: 2; }
    .guide { stroke: black; stroke-width: 1; }
    .label { font-family: sans-serif; font-size: 14px; text-anchor: middle; }
    .axis-label { font-family: sans-serif; font-size: 14px; }
  </style>
  
  <!-- Y-axis -->
  <line x1="80" y1="280" x2="80" y2="40" class="axis" />
  <polygon points="76,40 80,30 84,40" fill="black" />
  <text x="-200" y="45" class="axis-label" transform="rotate(-90)">Relative</text>
  <text x="-200" y="60" class="axis-label" transform="rotate(-90)">abundance</text>

  <!-- X-axis -->
  <line x1="80" y1="280" x2="420" y2="280" class="axis" />
  <polygon points="420,276 430,280 420,284" fill="black" />
  <text x="440" y="285" class="axis-label">Mass</text>

  <!-- Peak 10 -->
  <line x1="200" y1="280" x2="200" y2="230" class="peak" />
  <text x="200" y="300" class="label">10</text>
  <line x1="200" y1="230" x2="80" y2="230" class="guide" />
  <text x="60" y="235" class="label" text-anchor="end">2</text>
  
  <!-- Peak 12 -->
  <line x1="320" y1="280" x2="320" y2="70" class="peak" />
  <text x="320" y="300" class="label">12</text>
  <line x1="320" y1="70" x2="80" y2="70" class="guide" />
  <text x="60" y="75" class="label" text-anchor="end">9</text>
</svg>
