<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <style>
    .axis { stroke: black; stroke-width: 1.5; }
    .line { stroke: black; stroke-width: 1.8; fill: none; }
    .label { font-family: sans-serif; font-size: 12px; }
    .opt { font-family: sans-serif; font-size: 14px; font-weight: bold; }
  </style>
  <g transform="translate(30, 20)">
    <text x="0" y="20" class="opt">A</text>
    <line x1="40" y1="120" x2="130" y2="120" class="axis" />
    <line x1="40" y1="120" x2="40" y2="20" class="axis" />
    <text x="15" y="70" class="label">Kc</text>
    <text x="80" y="135" class="label">T</text>
    <polyline points="45,40 120,110" class="line" />
  </g>
  <g transform="translate(280, 20)">
    <text x="0" y="20" class="opt">B</text>
    <line x1="40" y1="120" x2="130" y2="120" class="axis" />
    <line x1="40" y1="120" x2="40" y2="20" class="axis" />
    <text x="15" y="70" class="label">Kc</text>
    <text x="80" y="135" class="label">T</text>
    <path d="M 45 40 Q 90 110 125 115" class="line" />
  </g>
  <g transform="translate(30, 180)">
    <text x="0" y="20" class="opt">C</text>
    <line x1="40" y1="120" x2="130" y2="120" class="axis" />
    <line x1="40" y1="120" x2="40" y2="20" class="axis" />
    <text x="15" y="70" class="label">Kc</text>
    <text x="80" y="135" class="label">T</text>
    <polyline points="45,110 120,40" class="line" />
  </g>
  <g transform="translate(280, 180)">
    <text x="0" y="20" class="opt">D</text>
    <line x1="40" y1="120" x2="130" y2="120" class="axis" />
    <line x1="40" y1="120" x2="40" y2="20" class="axis" />
    <text x="15" y="70" class="label">Kc</text>
    <text x="80" y="135" class="label">T</text>
    <path d="M 45 115 Q 90 40 125 35" class="line" />
  </g>
</svg>