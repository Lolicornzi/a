<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="100%" height="100%">
  <style>
    .axis { stroke: black; stroke-width: 1.5; }
    .line { stroke: black; stroke-width: 1.8; fill: none; }
    .label { font-family: sans-serif; font-size: 12px; }
  </style>
  <g transform="translate(30, 20)">
    <line x1="30" y1="120" x2="130" y2="120" class="axis" />
    <line x1="30" y1="120" x2="30" y2="20" class="axis" />
    <text x="5" y="70" class="label">Rate</text>
    <text x="70" y="135" class="label">[W]</text>
    <polyline points="35,115 120,115" class="line" />
  </g>
  <g transform="translate(200, 20)">
    <line x1="30" y1="120" x2="130" y2="120" class="axis" />
    <line x1="30" y1="120" x2="30" y2="20" class="axis" />
    <text x="5" y="70" class="label">Rate</text>
    <text x="70" y="135" class="label">[X]</text>
    <path d="M 35 115 Q 90 115 125 30" class="line" />
  </g>
</svg>