<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <style>
    .box { fill: #d1d5db; stroke: black; stroke-width: 1.5; }
    .axis { stroke: black; stroke-width: 1.5; }
    .label { font-family: sans-serif; font-size: 12px; text-anchor: middle; }
  </style>
  <rect x="70" y="30" width="40" height="60" class="box" />
  <rect x="70" y="90" width="40" height="60" class="box" fill="white" />
  <line x1="40" y1="170" x2="140" y2="170" class="axis" />
  <line x1="40" y1="170" x2="40" y2="20" class="axis" />
  <text x="25" y="95" class="label" transform="rotate(-90 25 95)">Energy</text>
  <text x="140" y="45" class="label" text-anchor="start">Conduction band</text>
  <text x="140" y="125" class="label" text-anchor="start">Valence band</text>
</svg>