<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <style>
    .level { stroke: black; stroke-width: 1.2; }
    .label { font-family: sans-serif; font-size: 11px; }
  </style>
  <line x1="50" y1="40" x2="130" y2="40" class="level" />
  <text x="140" y="44" class="label">M²⁺(g) + O²⁻(g)</text>

  <line x1="50" y1="120" x2="130" y2="120" class="level" />
  <text x="140" y="124" class="label">M²⁺(g) + O(g)</text>

  <line x1="50" y1="180" x2="130" y2="180" class="level" />
  <text x="140" y="184" class="label">M⁺(g) + O(g)</text>

  <line x1="50" y1="240" x2="130" y2="240" class="level" />
  <text x="140" y="244" class="label">M(g) + O(g)</text>

  <line x1="50" y1="270" x2="130" y2="270" class="level" />
  <text x="140" y="274" class="label">M(s) + ½O₂(g)</text>

  <line x1="270" y1="270" x2="350" y2="270" class="level" />
  <text x="360" y="274" class="label">MO(s)</text>
</svg>