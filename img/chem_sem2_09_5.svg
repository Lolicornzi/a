<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="100%" height="100%">
  <style>
    .bulb { fill: none; stroke: black; stroke-width: 1.5; }
    .text { font-family: sans-serif; font-size: 14px; font-weight: bold; }
    .valve { stroke: black; stroke-width: 1.5; }
  </style>
  <circle cx="100" cy="80" r="50" class="bulb" />
  <circle cx="350" cy="80" r="50" class="bulb" />
  <line x1="150" y1="80" x2="300" y2="80" class="valve" />
  <rect x="215" y="70" width="20" height="20" fill="white" stroke="black" stroke-width="1.5" />
  <text x="90" y="75" class="text">P</text>
  <text x="70" y="100" class="text">N₂, 6 dm³</text>
  <text x="70" y="120" class="text">200 kPa</text>
  <text x="340" y="75" class="text">Q</text>
  <text x="320" y="100" class="text">H₂, 4 dm³</text>
  <text x="320" y="120" class="text">500 kPa</text>
  <text x="210" y="45" class="text">Stopcock</text>
  <line x1="225" y1="50" x2="225" y2="70" stroke="black" marker-end="url(#arrow)" />
</svg>