<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <style>
    .axis { stroke: black; stroke-width: 1.5; }
    .line { stroke: black; stroke-width: 1.8; fill: none; }
    .label { font-family: sans-serif; font-size: 12px; }
  </style>
  <line x1="50" y1="200" x2="350" y2="200" class="axis" />
  <text x="180" y="230" class="label">Energy</text>
  <line x1="50" y1="200" x2="50" y2="30" class="axis" />
  <text x="10" y="120" class="label" transform="rotate(-90 10 120)">Number of molecules</text>
  <path d="M 50 200 Q 120 40 250 190" class="line" />
  <text x="230" y="170" class="label">X</text>
  <path d="M 50 200 Q 150 80 320 195" class="line" />
  <text x="290" y="160" class="label">Y</text>
</svg>