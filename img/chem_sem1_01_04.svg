<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <style>
    .axis { stroke: black; stroke-width: 1.5; }
    .peak { stroke: black; stroke-width: 2; }
    .label { font-family: sans-serif; font-size: 13px; text-anchor: middle; }
  </style>
  <!-- X-axis -->
  <line x1="30" y1="200" x2="370" y2="200" class="axis" />
  <polygon points="370,196 380,200 370,204" fill="black" />
  <text x="385" y="204" class="label" text-anchor="start">m/e</text>
  
  <!-- Peaks -->
  <line x1="80" y1="200" x2="80" y2="180" class="peak" />
  <text x="80" y="220" class="label">14</text>
  
  <line x1="120" y1="200" x2="120" y2="180" class="peak" />
  <text x="120" y="220" class="label">16</text>
  
  <line x1="200" y1="200" x2="200" y2="120" class="peak" />
  <text x="200" y="220" class="label">28</text>
  
  <line x1="280" y1="200" x2="280" y2="40" class="peak" />
  <text x="280" y="220" class="label">44</text>
</svg>
