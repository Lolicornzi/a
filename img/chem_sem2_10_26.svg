<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <style>
    .axis { stroke: black; stroke-width: 1.5; }
    .line { stroke: black; stroke-width: 1.8; fill: none; }
    .label { font-family: sans-serif; font-size: 12px; }
  </style>
  <line x1="40" y1="160" x2="240" y2="160" class="axis" />
  <text x="120" y="185" class="label">Volume of HCl</text>
  <line x1="40" y1="160" x2="40" y2="20" class="axis" />
  <text x="15" y="90" class="label">pH</text>
  <polyline points="50,130 90,70 150,70 190,30" class="line" />
  <text x="70" y="60" class="label">A</text>
  <text x="120" y="60" class="label">B</text>
  <text x="165" y="60" class="label">C</text>
  <text x="210" y="25" class="label">D</text>
</svg>