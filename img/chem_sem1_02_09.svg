<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <style>
    .box { fill: none; stroke: black; stroke-width: 1.5; }
    .line { stroke: black; stroke-width: 1.5; }
    .arrow { stroke: black; stroke-width: 1; fill: black; }
    .text { font-family: sans-serif; font-size: 12px; }
    .opt { font-family: sans-serif; font-size: 16px; font-weight: bold; }
  </style>

  <!-- Option A -->
  <g transform="translate(30, 20)">
    <text x="0" y="30" class="opt">A</text>
    <rect x="30" y="0" width="200" height="40" class="box" />
    <line x1="35" y1="0" x2="35" y2="40" class="line" />
    <line x1="42" y1="0" x2="42" y2="40" class="line" />
    <line x1="52" y1="0" x2="52" y2="40" class="line" />
    <line x1="68" y1="0" x2="68" y2="40" class="line" />
    <line x1="95" y1="0" x2="95" y2="40" class="line" />
    <line x1="140" y1="0" x2="140" y2="40" class="line" />
    <line x1="210" y1="0" x2="210" y2="40" class="line" />
    
    <line x1="220" y1="60" x2="35" y2="60" class="arrow" />
    <polygon points="35,60 45,55 45,65" class="arrow" />
    <text x="85" y="80" class="text">Wave number</text>
  </g>

  <!-- Option B -->
  <g transform="translate(30, 120)">
    <text x="0" y="30" class="opt">B</text>
    <rect x="30" y="0" width="200" height="40" class="box" />
    <line x1="50" y1="0" x2="50" y2="40" class="line" />
    <line x1="120" y1="0" x2="120" y2="40" class="line" />
    <line x1="165" y1="0" x2="165" y2="40" class="line" />
    <line x1="192" y1="0" x2="192" y2="40" class="line" />
    <line x1="208" y1="0" x2="208" y2="40" class="line" />
    <line x1="218" y1="0" x2="218" y2="40" class="line" />
    <line x1="225" y1="0" x2="225" y2="40" class="line" />
    
    <line x1="220" y1="60" x2="35" y2="60" class="arrow" />
    <polygon points="35,60 45,55 45,65" class="arrow" />
    <text x="85" y="80" class="text">Wave number</text>
  </g>

  <!-- Option C -->
  <g transform="translate(30, 220)">
    <text x="0" y="30" class="opt">C</text>
    <rect x="30" y="0" width="200" height="40" class="box" />
    <line x1="45" y1="0" x2="45" y2="40" class="line" />
    <line x1="75" y1="0" x2="75" y2="40" class="line" />
    <line x1="105" y1="0" x2="105" y2="40" class="line" />
    <line x1="135" y1="0" x2="135" y2="40" class="line" />
    <line x1="165" y1="0" x2="165" y2="40" class="line" />
    <line x1="195" y1="0" x2="195" y2="40" class="line" />
    <line x1="225" y1="0" x2="225" y2="40" class="line" />
    
    <line x1="220" y1="60" x2="35" y2="60" class="arrow" />
    <polygon points="35,60 45,55 45,65" class="arrow" />
    <text x="85" y="80" class="text">Wave number</text>
  </g>

  <!-- Option D -->
  <g transform="translate(30, 320)">
    <text x="0" y="30" class="opt">D</text>
    <rect x="30" y="0" width="200" height="40" class="box" />
    <line x1="45" y1="0" x2="45" y2="40" class="line" />
    <line x1="55" y1="0" x2="55" y2="40" class="line" />
    <line x1="70" y1="0" x2="70" y2="40" class="line" />
    <line x1="95" y1="0" x2="95" y2="40" class="line" />
    <line x1="135" y1="0" x2="135" y2="40" class="line" />
    <line x1="190" y1="0" x2="190" y2="40" class="line" />
    <line x1="225" y1="0" x2="225" y2="40" class="line" />
    
    <line x1="220" y1="60" x2="35" y2="60" class="arrow" />
    <polygon points="35,60 45,55 45,65" class="arrow" />
    <text x="85" y="80" class="text">Wave number</text>
  </g>
</svg>
