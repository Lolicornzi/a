<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <style>
    .opt { font-family: sans-serif; font-size: 14px; font-weight: bold; }
    .chem { font-family: sans-serif; font-size: 14px; }
    .bond { stroke: black; stroke-width: 1.5; }
  </style>
  <!-- Option A -->
  <g transform="translate(20, 20)">
    <text x="0" y="20" class="opt">A</text>
    <text x="25" y="20" class="chem">Si²⁺ 2Cl⁻</text>
  </g>
  <!-- Option B -->
  <g transform="translate(150, 20)">
    <text x="0" y="20" class="opt">B</text>
    <text x="25" y="20" class="chem">Si⁴⁺ 4Cl⁻</text>
  </g>
  <!-- Option C -->
  <g transform="translate(280, 10)">
    <text x="0" y="20" class="opt">C</text>
    <text x="60" y="20" class="chem">Cl</text>
    <text x="30" y="60" class="chem">Cl — Si — Cl</text>
    <text x="60" y="95" class="chem">Cl</text>
    <line x1="50" y1="45" x2="65" y2="25" class="bond"/>
    <line x1="85" y1="45" x2="70" y2="25" class="bond"/>
    <line x1="75" y1="52" x2="100" y2="52" class="bond"/>
  </g>
  <!-- Option D -->
  <g transform="translate(450, 10)">
    <text x="0" y="20" class="opt">D</text>
    <text x="30" y="30" class="chem">Cl₃Si — SiCl₃</text>
  </g>
</svg>