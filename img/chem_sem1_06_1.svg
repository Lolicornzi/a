<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <style>
    .box { fill: #d1d5db; stroke: black; stroke-width: 1.5; }
    .axis { stroke: black; stroke-width: 1.5; }
    .label { font-family: sans-serif; font-size: 12px; text-anchor: middle; }
    .title { font-family: sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
  </style>
  <!-- Substance X -->
  <g transform="translate(50, 20)">
    <rect x="40" y="20" width="40" height="40" class="box" />
    <rect x="40" y="60" width="40" height="80" class="box" fill="white" />
    <line x1="20" y1="160" x2="100" y2="160" class="axis" />
    <line x1="20" y1="160" x2="20" y2="20" class="axis" />
    <text x="10" y="90" class="label" transform="rotate(-90 10 90)">Energy</text>
    <text x="60" y="180" class="title">X</text>
    <text x="110" y="25" class="label" text-anchor="start">Conduction band</text>
    <text x="110" y="100" class="label" text-anchor="start">Valence band</text>
  </g>
  <!-- Substance Y -->
  <g transform="translate(250, 20)">
    <rect x="40" y="20" width="40" height="40" class="box" />
    <rect x="40" y="80" width="40" height="40" class="box" fill="white" />
    <rect x="40" y="120" width="40" height="40" class="box" fill="white" />
    <line x1="20" y1="160" x2="100" y2="160" class="axis" />
    <line x1="20" y1="160" x2="20" y2="20" class="axis" />
    <text x="60" y="180" class="title">Y</text>
  </g>
  <!-- Substance Z -->
  <g transform="translate(450, 20)">
    <rect x="40" y="20" width="40" height="40" class="box" />
    <rect x="40" y="120" width="40" height="40" class="box" fill="white" />
    <line x1="20" y1="160" x2="100" y2="160" class="axis" />
    <line x1="20" y1="160" x2="20" y2="20" class="axis" />
    <text x="60" y="180" class="title">Z</text>
  </g>
</svg>