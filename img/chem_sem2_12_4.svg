<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <style>
    .axis { stroke: black; stroke-width: 1.5; }
    .level { stroke: black; stroke-width: 1.2; }
    .arrow { stroke: #2563eb; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .label { font-family: sans-serif; font-size: 11px; }
  </style>
  <line x1="50" y1="260" x2="50" y2="30" class="axis" />
  <text x="20" y="150" class="label" transform="rotate(-90 20 150)">Enthalpy / kJ</text>
  
  <!-- Energy Levels -->
  <line x1="80" y1="50" x2="160" y2="50" class="level" />
  <text x="170" y="54" class="label">Ca²⁺(g) + O²⁻(g)</text>

  <line x1="80" y1="90" x2="160" y2="90" class="level" />
  <text x="170" y="94" class="label">Ca²⁺(g) + O⁻(g) + e⁻</text>

  <line x1="80" y1="130" x2="160" y2="130" class="level" />
  <text x="170" y="134" class="label">Ca²⁺(g) + O(g) + 2e⁻</text>

  <line x1="80" y1="180" x2="160" y2="180" class="level" />
  <text x="170" y="184" class="label">Ca(g) + O(g)</text>

  <line x1="80" y1="220" x2="160" y2="220" class="level" />
  <text x="170" y="224" class="label">Ca(g) + ½O₂(g)</text>

  <line x1="80" y1="250" x2="160" y2="250" class="level" />
  <text x="170" y="254" class="label">CaO(s)</text>
</svg>