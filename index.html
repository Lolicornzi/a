<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemLingo - Global Chemistry Leaderboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase Legacy SDKs (v8 Compat for quick drop-in setup) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #131f24;
            color: white;
        }
        .duo-btn {
            box-shadow: 0 4px 0 #46a302;
            transition: all 0.1s ease;
        }
        .duo-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #46a302;
        }
        .option-btn {
            box-shadow: 0 4px 0 #37464f;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #37464f;
        }
        /* Custom scrollbar for leaderboard list */
        #leaderboard-list::-webkit-scrollbar {
            width: 4px;
        }
        #leaderboard-list::-webkit-scrollbar-thumb {
            background-color: #37464f;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between max-w-md mx-auto border-x border-gray-800">

    <!-- TOP BAR -->
    <div class="p-4 flex justify-between items-center border-b border-gray-800 bg-[#131f24] sticky top-0 z-10">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-bolt text-amber-500 text-xl"></i>
            <span id="score-display" class="font-bold text-amber-500 text-base">0 XP</span>
        </div>
        <!-- Progress Bar -->
        <div class="w-1/3 bg-gray-700 h-4 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-[#58cc02] h-full w-0 transition-all duration-300"></div>
        </div>
        <!-- Accuracy Display -->
        <div class="flex items-center gap-1.5">
            <i class="fa-solid fa-bullseye text-cyan-400 text-xl"></i>
            <span id="accuracy-display" class="font-bold text-cyan-400 text-base">100%</span>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="p-5 flex-1 flex flex-col justify-center">

        <!-- AUTH SCREEN (Login / Signup) -->
        <div id="auth-screen" class="space-y-4">
            <div class="text-center">
                <div id="auth-main-icon" class="text-6xl text-[#58cc02] mb-2"><i class="fa-solid fa-user-lock"></i></div>
                <h2 id="auth-title" class="text-2xl font-extrabold text-white">Sign In to ChemLingo</h2>
                <p class="text-gray-400 text-xs mt-1">Keep your highscore secure & join the world leaderboard</p>
            </div>
            
            <div class="space-y-3 bg-gray-800/50 p-5 rounded-2xl border border-gray-700">
                <!-- AVATAR SELECTOR (Sign up only) -->
                <div id="auth-avatar-container" class="hidden">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2 text-center">Choose an Avatar</label>
                    <div class="grid grid-cols-6 gap-2 justify-center" id="avatar-grid">
                        <!-- Populated dynamically via JS -->
                    </div>
                </div>

                <div id="auth-username-container" class="hidden">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Display Name</label>
                    <input type="text" id="auth-username" placeholder="e.g. ProtonChamp" class="w-full p-3 rounded-xl bg-gray-800 border-2 border-gray-700 text-white font-bold focus:outline-none focus:border-[#58cc02] text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Email</label>
                    <input type="email" id="auth-email" placeholder="you@domain.com" class="w-full p-3 rounded-xl bg-gray-800 border-2 border-gray-700 text-white font-bold focus:outline-none focus:border-[#58cc02] text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full p-3 rounded-xl bg-gray-800 border-2 border-gray-700 text-white font-bold focus:outline-none focus:border-[#58cc02] text-sm">
                </div>

                <div id="auth-error" class="hidden text-xs text-red-500 font-bold bg-red-950/40 p-3 rounded-lg border border-red-900"></div>

                <button id="auth-main-btn" onclick="handleAuthSubmit()" class="duo-btn w-full bg-[#58cc02] hover:bg-[#46a302] text-white font-bold py-3 rounded-xl uppercase tracking-wider text-sm">
                    Login
                </button>
            </div>

            <div class="text-center text-xs space-y-2">
                <p class="text-gray-400">
                    <span id="auth-toggle-text">Don't have an account?</span> 
                    <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-[#58cc02] font-bold underline ml-1 focus:outline-none">Sign Up</button>
                </p>
                <button onclick="skipAuth()" class="text-gray-500 hover:text-gray-400 underline font-semibold block mx-auto">
                    Play Guest Mode (Rankings won't persist securely)
                </button>
            </div>
        </div>

        <!-- START SCREEN -->
        <div id="start-screen" class="hidden text-center space-y-4">
            <div class="flex justify-between items-center bg-gray-800/40 p-3 rounded-xl border border-gray-700 mb-2">
                <div class="flex items-center gap-2">
                    <span id="user-display-avatar" class="text-2xl">🧪</span>
                    <span id="user-display-name" class="font-bold text-sm text-gray-200">Loading...</span>
                </div>
                <button id="logout-btn" onclick="logoutUser()" class="text-xs font-bold text-red-400 hover:text-red-300 underline">
                    Log out
                </button>
            </div>

            <div class="text-6xl text-[#58cc02]"><i class="fa-solid fa-flask"></i></div>
            <h1 class="text-3xl font-extrabold text-white">ChemLingo</h1>
            <p class="text-gray-400 text-sm">Practice Chemistry & Compete Globally</p>
            
            <div class="space-y-3 pt-2">
                <button onclick="startGame(1)" class="duo-btn w-full bg-[#58cc02] hover:bg-[#46a302] text-white font-bold py-3.5 rounded-xl uppercase tracking-wider text-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-atom"></i> Semester 1 (Inorganic)
                </button>
                <button onclick="startGame(3)" class="duo-btn w-full bg-[#1cb0f6] hover:bg-[#1899d6] text-white font-bold py-3.5 rounded-xl uppercase tracking-wider text-md flex items-center justify-center gap-2" style="box-shadow: 0 4px 0 #1899d6;">
                    <i class="fa-solid fa-dna"></i> Semester 3 (Organic)
                </button>
                <button onclick="startGame('all')" class="duo-btn w-full bg-[#ffb800] hover:bg-[#e0a200] text-gray-900 font-extrabold py-3.5 rounded-xl uppercase tracking-wider text-md flex items-center justify-center gap-2" style="box-shadow: 0 4px 0 #d69b00;">
                    <i class="fa-solid fa-bolt"></i> Mixed Mode
                </button>
            </div>
            
            <button onclick="showGlobalLeaderboard()" class="w-full bg-gray-800 border-2 border-gray-700 text-gray-300 font-bold py-3 rounded-xl uppercase tracking-wider text-sm mt-4 hover:border-amber-400 transition">
                <i class="fa-solid fa-globe text-amber-400 mr-2"></i> Global Leaderboard
            </button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden flex-col justify-between flex-1">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <span id="semester-badge" class="bg-gray-800 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full text-[#58cc02]">
                        Semester
                    </span>
                    <span id="category-badge" class="bg-gray-800 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full text-gray-400">
                        Category
                    </span>
                </div>
                <h2 id="question-text" class="text-lg sm:text-xl font-bold mb-6 text-white leading-relaxed">
                    Question text will appear here...
                </h2>
                <div id="options-container" class="space-y-3">
                    <!-- Dynamic Options -->
                </div>
            </div>

            <!-- FEEDBACK BAR -->
            <div id="feedback-card" class="hidden rounded-xl p-4 mt-6">
