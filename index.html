<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemLingo - Working Build</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ✅ Corrected: Using the single, all-in-one Firebase 8 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #131f24; color: white; }
        .duo-btn { box-shadow: 0 4px 0 #46a302; transition: all 0.1s ease; }
        .duo-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #46a302; }
        .option-btn { box-shadow: 0 4px 0 #37464f; }
        .option-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #37464f; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between max-w-md mx-auto border-x border-gray-800">

    <!-- UI Elements -->
    <div class="p-4 flex justify-between items-center border-b border-gray-800 bg-[#131f24] sticky top-0 z-10">
        <div class="flex items-center gap-2"><i class="fa-solid fa-bolt text-amber-500 text-xl"></i><span id="score-display" class="font-bold text-amber-500 text-base">0 XP</span></div>
        <div class="w-1/3 bg-gray-700 h-4 rounded-full overflow-hidden"><div id="progress-bar" class="bg-[#58cc02] h-full w-0 transition-all duration-300"></div></div>
        <div class="flex items-center gap-1.5"><i class="fa-solid fa-bullseye text-cyan-400 text-xl"></i><span id="accuracy-display" class="font-bold text-cyan-400 text-base">100%</span></div>
    </div>
    
    <main class="p-5 flex-1 flex flex-col justify-center">
        <!-- START SCREEN -->
        <div id="start-screen" class="hidden text-center space-y-4">
            <h1 class="text-3xl font-extrabold text-white">ChemLingo</h1>
            <p class="text-gray-400 text-sm">Practice Chemistry & Compete Globally</p>
            <div class="space-y-3 pt-2">
                <button onclick="startGame()" class="duo-btn w-full bg-[#58cc02] hover:bg-[#46a302] text-white font-bold py-3.5 rounded-xl uppercase tracking-wider text-md">Start Quiz</button>
            </div>
        </div>
        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="hidden flex-col justify-between flex-1">
            <div>
                <h2 id="question-text" class="text-xl font-bold mb-6"></h2>
                <div id="options-container" class="space-y-3"></div>
            </div>
            <div id="feedback-card" class="hidden rounded-xl p-4 mt-6">
                <h3 id="feedback-title" class="font-bold text-lg"></h3>
                <p id="feedback-detail" class="text-sm"></p>
                <button id="next-btn" onclick="nextQuestion()" class="w-full py-3 rounded-xl font-bold text-white uppercase mt-4">Continue</button>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const firebaseConfig = {
                apiKey: "AIzaSyDh-sZfMcPjW1kFLTT9N1mxIm60HmK_5oG4",
                authDomain: "a-test-chem.firebaseapp.com",
                databaseURL: "https://a-test-chem-default-rtdb.firebaseio.com",
                projectId: "a-test-chem",
                storageBucket: "a-test-chem.appspot.com",
                messagingSenderId: "1030899671595",
                appId: "1:1030899671595:web:7dbc83440ea459cfea806e"
            };
            
            try {
                firebase.initializeApp(firebaseConfig);
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                alert("CRITICAL ERROR: Could not initialize Firebase. The app cannot run.");
                return;
            }

            const db = firebase.database();
            const auth = firebase.auth();

            const reactionsData = [
                { sem: 1, category: "Stoichiometry", question: "Which statement is correct?", options: ["A mass spectrum provides evidence of isotopes.", "A mass spectrum proves protons exist.", "A mass spectrum proves protons and neutrons exist."], answer: "A mass spectrum provides evidence of isotopes." },
                { sem: 1, category: "Stoichiometry", question: "Boron has a relative atomic mass of 10.8 and two isotopes, ¹⁰B and ¹¹B. What is the abundance ratio of the heavier to the lighter isotope?", options: ["1:4", "4:1", "1:5", "5:1"], answer: "4:1" },
                { sem: 1, category: "Atomic Structure", question: "What is the maximum number of atomic orbitals for principal quantum number n=3?", options: ["3", "5", "9", "18"], answer: "9" },
            ];
            
            let currentQuestions = [], currentIdx = 0, score = 0, totalAnswered = 0, correctCount = 0;
            
            const startScreen = document.getElementById('start-screen');
            const quizScreen = document.getElementById('quiz-screen');
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const feedbackCard = document.getElementById('feedback-card');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDetail = document.getElementById('feedback-detail');
            const nextBtn = document.getElementById('next-btn');

            window.startGame = function() {
                currentQuestions = reactionsData;
                currentIdx = 0; score = 0; totalAnswered = 0; correctCount = 0;
                updateHeader();
                loadQuestion();
                showScreen('quiz');
            }

            window.nextQuestion = function() {
                currentIdx++;
                loadQuestion();
            }

            function showScreen(screenName) {
                startScreen.classList.add('hidden');
                quizScreen.classList.add('hidden');
                if (screenName === 'start') {
                    startScreen.classList.remove('hidden');
                } else if (screenName === 'quiz') {
                    quizScreen.classList.remove('hidden');
                    quizScreen.classList.add('flex');
                }
            }

            function updateHeader() {
                document.getElementById("score-display").innerText = `${score} XP`;
                const accuracy = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 100;
                document.getElementById("accuracy-display").innerText = `${accuracy}%`;
                const progress = currentQuestions.length > 0 ? (currentIdx / currentQuestions.length) * 100 : 0;
                document.getElementById("progress-bar").style.width = `${progress}%`;
            }

            function loadQuestion() {
                feedbackCard.classList.add('hidden');
                if (currentIdx >= currentQuestions.length) {
                    finishGame();
                    return;
                }
                const q = currentQuestions[currentIdx];
                questionText.innerText = q.question;
                optionsContainer.innerHTML = "";
                q.options.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn w-full bg-gray-800 border-2 border-gray-700 text-white font-semibold py-3.5 px-4 rounded-xl text-left hover:border-gray-500 transition";
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(opt, q.answer, btn);
                    optionsContainer.appendChild(btn);
                });
                updateHeader();
            }

            function checkAnswer(selected, correct, btn) {
                document.querySelectorAll(".option-btn").forEach(b => { b.disabled = true; });
                totalAnswered++;
                const isCorrect = selected === correct;
                if (isCorrect) {
                    score += 10;
                    correctCount++;
                    feedbackTitle.innerText = "Correct!";
                    feedbackDetail.innerText = "+10 XP";
                    nextBtn.className = "w-full py-3 rounded-xl font-bold text-white uppercase mt-4 bg-[#58cc02]";
                    btn.classList.add("bg-green-900/50", "border-[#58cc02]");
                } else {
                    feedbackTitle.innerText = "Incorrect";
                    feedbackDetail.innerText = `Correct Answer: ${correct}`;
                    nextBtn.className = "w-full py-3 rounded-xl font-bold text-white uppercase mt-4 bg-red-500";
                    btn.classList.add("bg-red-900/50", "border-red-500");
                }
                feedbackCard.classList.remove('hidden');
                updateHeader();
            }

            function finishGame() {
                alert(`Quiz Complete!\nYour score: ${score} XP\nAccuracy: ${totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 100}%`);
                showScreen('start');
            }

            // Initial App Load
            function init() {
                showScreen('start');
            }

            init();
        });
    </script>
</body>
</html>
