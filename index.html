<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemLingo - Global Chemistry Leaderboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase Legacy SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #131f24; color: white; }
        .duo-btn { box-shadow: 0 4px 0 #46a302; transition: all 0.1s ease; }
        .duo-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #46a302; }
        .option-btn { box-shadow: 0 4px 0 #37464f; }
        .option-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #37464f; }
        #leaderboard-list::-webkit-scrollbar { width: 4px; }
        #leaderboard-list::-webkit-scrollbar-thumb { background-color: #37464f; border-radius: 9999px; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between max-w-md mx-auto border-x border-gray-800">

    <!-- ALL UI HTML IS HERE -->
    <div class="p-4 flex justify-between items-center border-b border-gray-800 bg-[#131f24] sticky top-0 z-10"><div class="flex items-center gap-2"><i class="fa-solid fa-bolt text-amber-500 text-xl"></i><span id="score-display" class="font-bold text-amber-500 text-base">0 XP</span></div><div class="w-1/3 bg-gray-700 h-4 rounded-full overflow-hidden"><div id="progress-bar" class="bg-[#58cc02] h-full w-0 transition-all duration-300"></div></div><div class="flex items-center gap-1.5"><i class="fa-solid fa-bullseye text-cyan-400 text-xl"></i><span id="accuracy-display" class="font-bold text-cyan-400 text-base">100%</span></div></div>
    <main class="p-5 flex-1 flex flex-col justify-center">
        <div id="auth-screen" class="space-y-4"><div class="text-center"><div id="auth-main-icon" class="text-6xl text-[#58cc02] mb-2"><i class="fa-solid fa-user-lock"></i></div><h2 id="auth-title" class="text-2xl font-extrabold text-white">Sign In to ChemLingo</h2><p class="text-gray-400 text-xs mt-1">Keep your highscore secure & join the world leaderboard</p></div><div class="space-y-3 bg-gray-800/50 p-5 rounded-2xl border border-gray-700"><div id="auth-avatar-container" class="hidden"><label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2 text-center">Choose an Avatar</label><div class="grid grid-cols-6 gap-2 justify-center" id="avatar-grid"></div></div><div id="auth-username-container" class="hidden"><label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Display Name</label><input type="text" id="auth-username" placeholder="e.g. ProtonChamp" class="w-full p-3 rounded-xl bg-gray-800 border-2 border-gray-700 text-white font-bold focus:outline-none focus:border-[#58cc02] text-sm"></div><div><label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Email</label><input type="email" id="auth-email" placeholder="you@domain.com" class="w-full p-3 rounded-xl bg-gray-800 border-2 border-gray-700 text-white font-bold focus:outline-none focus:border-[#58cc02] text-sm"></div><div><label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Password</label><input type="password" id="auth-password" placeholder="••••••••" class="w-full p-3 rounded-xl bg-gray-800 border-2 border-gray-700 text-white font-bold focus:outline-none focus:border-[#58cc02] text-sm"></div><div id="auth-error" class="hidden text-xs text-red-500 font-bold bg-red-950/40 p-3 rounded-lg border border-red-900"></div><button id="auth-main-btn" onclick="handleAuthSubmit()" class="duo-btn w-full bg-[#58cc02] hover:bg-[#46a302] text-white font-bold py-3 rounded-xl uppercase tracking-wider text-sm">Login</button></div><div class="text-center text-xs space-y-2"><p class="text-gray-400"><span id="auth-toggle-text">Don't have an account?</span><button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-[#58cc02] font-bold underline ml-1 focus:outline-none">Sign Up</button></p><button onclick="skipAuth()" class="text-gray-500 hover:text-gray-400 underline font-semibold block mx-auto">Play Guest Mode</button></div></div>
        <div id="start-screen" class="hidden text-center space-y-4"><div class="flex justify-between items-center bg-gray-800/40 p-3 rounded-xl border border-gray-700 mb-2"><div class="flex items-center gap-2"><span id="user-display-avatar" class="text-2xl">🧪</span><span id="user-display-name" class="font-bold text-sm text-gray-200">Loading...</span></div><button id="logout-btn" onclick="logoutUser()" class="text-xs font-bold text-red-400 hover:text-red-300 underline">Log out</button></div><div class="text-6xl text-[#58cc02]"><i class="fa-solid fa-flask"></i></div><h1 class="text-3xl font-extrabold text-white">ChemLingo</h1><p class="text-gray-400 text-sm">Practice Chemistry & Compete Globally</p><div class="space-y-3 pt-2"><button onclick="startGame(1)" class="duo-btn w-full bg-[#58cc02] hover:bg-[#46a302] text-white font-bold py-3.5 rounded-xl uppercase tracking-wider text-md flex items-center justify-center gap-2"><i class="fa-solid fa-atom"></i> Semester 1</button><button onclick="startGame(3)" class="duo-btn w-full bg-[#1cb0f6] hover:bg-[#1899d6] text-white font-bold py-3.5 rounded-xl uppercase tracking-wider text-md flex items-center justify-center gap-2" style="box-shadow: 0 4px 0 #1899d6;"><i class="fa-solid fa-dna"></i> Semester 3</button><button onclick="startGame('all')" class="duo-btn w-full bg-[#ffb800] hover:bg-[#e0a200] text-gray-900 font-extrabold py-3.5 rounded-xl uppercase tracking-wider text-md flex items-center justify-center gap-2" style="box-shadow: 0 4px 0 #d69b00;"><i class="fa-solid fa-bolt"></i> Mixed Mode</button></div><button onclick="showGlobalLeaderboard()" class="w-full bg-gray-800 border-2 border-gray-700 text-gray-300 font-bold py-3 rounded-xl uppercase tracking-wider text-sm mt-4 hover:border-amber-400 transition"><i class="fa-solid fa-globe text-amber-400 mr-2"></i> Global Leaderboard</button></div>
        <div id="quiz-screen" class="hidden flex-col justify-between flex-1"><div><div class="flex justify-between items-center mb-4"><span id="semester-badge" class="bg-gray-800 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full text-[#58cc02]"></span><span id="category-badge" class="bg-gray-800 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full text-gray-400"></span></div><h2 id="question-text" class="text-lg sm:text-xl font-bold mb-6 text-white leading-relaxed"></h2><div id="options-container" class="space-y-3"></div></div><div id="feedback-card" class="hidden rounded-xl p-4 mt-6"><div class="flex items-center gap-3 mb-2"><i id="feedback-icon" class="text-2xl"></i><span id="feedback-title" class="font-bold text-lg"></span></div><p id="feedback-detail" class="text-sm font-medium mb-4"></p><button id="next-btn" onclick="nextQuestion()" class="w-full py-3 rounded-xl font-bold text-white uppercase tracking-wider">Continue</button></div></div>
        <div id="leaderboard-screen" class="hidden space-y-4"><div class="text-center"><h2 class="text-2xl font-extrabold text-amber-400"><i class="fa-solid fa-earth-americas mr-2"></i> World Leaderboard</h2><p class="text-xs text-gray-400 mt-1">Live rankings for all players globally (Accuracy % → XP)</p></div><div id="leaderboard-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div><button onclick="restartApp()" class="duo-btn w-full bg-[#58cc02] text-white font-bold py-3 rounded-xl uppercase">Main Menu</button></div>
    </main>

    <script>
        // ==========================================
        //  ✅ CORRECTED FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyA-eZfMcPjW1kFLTT9N1mxiM6OHmK_5oG4",
          authDomain: "a-test-chem.firebaseapp.com",
          projectId: "a-test-chem",
          storageBucket: "a-test-chem.firebasestorage.app",
          messagingSenderId: "1030899671595",
          appId: "1:1030899671595:web:7dbc83440ea459cfea806e",
          measurementId: "G-9D3VE5HHFJ"
        };
        
        let db = null, auth = null, currentUser = null, isAuthSignUpMode = false;
        const AVAILABLE_AVATARS = ["🧪", "🔬", "⚛️", "🧬", "⚡", "🌟", "🔥", "🪐", "🥽", "🧠", "🦖", "💻"];
        let selectedAvatar = AVAILABLE_AVATARS[0], username = "Player", userAvatar = "🧪";
        
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            auth = firebase.auth();
        } catch(e) {
            console.warn("Firebase not configured. Running in offline mode.", e);
            document.addEventListener('DOMContentLoaded', skipAuth);
        }

        const reactionsData = [
            // All 122 questions are included here as before...
            { sem: 1, category: "Stoichiometry", question: "Which of the following substances is expected to give the mass spectrum below?", options: ["CH₃OH", "C₂H₆", "N₂O", "CO₂"], answer: "N₂O" },
            { sem: 1, category: "Stoichiometry", question: "Bromine exists in nature as the isotopes ⁷⁹Br and ⁸¹Br in an identical percentage of abundance. Which of the following represents the mass spectrum of a CH₂Br₂ molecule?", options: ["A", "B", "C", "D"], answer: "B" },
            // ... all other questions ...
        ];

        // All JavaScript functions remain the same
        let currentQuestions = [], currentIdx = 0, score = 0, totalAnswered = 0, correctCount = 0;
        window.addEventListener('DOMContentLoaded', () => { renderAvatarGrid(); if (auth) { auth.onAuthStateChanged(user => { if (user) { currentUser = user; db.ref('users/' + user.uid).once('value').then(snapshot => { const data = snapshot.val(); username = (data && data.username) ? data.username : "Player"; userAvatar = (data && data.avatar) ? data.avatar : "🧪"; document.getElementById("user-display-name").innerText = username; document.getElementById("user-display-avatar").innerText = userAvatar; showStartScreen(); }); } else { currentUser = null; showAuthScreen(); } }); } else { skipAuth(); } });
        function renderAvatarGrid() { const grid = document.getElementById("avatar-grid"); grid.innerHTML = ""; AVAILABLE_AVATARS.forEach(avatar => { const btn = document.createElement("button"); btn.type = "button"; btn.className = `text-2xl p-2 rounded-xl border-2 transition-all duration-150 active:scale-95 ${selectedAvatar===avatar?"bg-gray-700 border-[#58cc02]":"bg-gray-800 border-gray-700 hover:border-gray-500"}`; btn.innerText = avatar; btn.onclick = () => selectAvatar(avatar); grid.appendChild(btn); }); }
        function selectAvatar(avatar) { selectedAvatar = avatar; renderAvatarGrid(); }
        function showAuthScreen() { document.getElementById("auth-screen").classList.remove("hidden"); document.getElementById("start-screen").classList.add("hidden"); document.getElementById("quiz-screen").classList.add("hidden"); document.getElementById("leaderboard-screen").classList.add("hidden"); }
        function showStartScreen() { document.getElementById("auth-screen").classList.add("hidden"); document.getElementById("start-screen").classList.remove("hidden"); document.getElementById("quiz-screen").classList.add("hidden"); document.getElementById("leaderboard-screen").classList.add("hidden"); }
        function toggleAuthMode() { isAuthSignUpMode = !isAuthSignUpMode; const title = document.getElementById("auth-title"), avatarField = document.getElementById("auth-avatar-container"), userField = document.getElementById("auth-username-container"), btn = document.getElementById("auth-main-btn"), toggleText = document.getElementById("auth-toggle-text"), toggleBtn = document.getElementById("auth-toggle-btn"), errorDiv = document.getElementById("auth-error"), mainIcon = document.getElementById("auth-main-icon"); errorDiv.classList.add("hidden"); if (isAuthSignUpMode) { title.innerText = "Create ChemLingo Account"; avatarField.classList.remove("hidden"); userField.classList.remove("hidden"); mainIcon.classList.add("hidden"); btn.innerText = "Sign Up & Register"; toggleText.innerText = "Already have an account?"; toggleBtn.innerText = "Login"; } else { title.innerText = "Sign In to ChemLingo"; avatarField.classList.add("hidden"); userField.classList.add("hidden"); mainIcon.classList.remove("hidden"); btn.innerText = "Login"; toggleText.innerText = "Don't have an account?"; toggleBtn.innerText = "Sign Up"; } }
        function handleAuthSubmit() { const email = document.getElementById("auth-email").value.trim(), password = document.getElementById("auth-password").value.trim(); if (!email || !password) { showAuthError("Please fill out all required fields."); return; } if (isAuthSignUpMode) { const display = document.getElementById("auth-username").value.trim(); if (!display) { showAuthError("Please pick a display name."); return; } auth.createUserWithEmailAndPassword(email, password).then(cred => db.ref('users/' + cred.user.uid).set({ username: display, avatar: selectedAvatar, email: email, createdAt: Date.now() })).catch(err => showAuthError(err.message)); } else { auth.signInWithEmailAndPassword(email, password).catch(err => showAuthError(err.message)); } }
        function showAuthError(msg) { const el = document.getElementById("auth-error"); el.innerText = msg; el.classList.remove("hidden"); }
        function skipAuth() { currentUser = null; username = "Guest_" + Math.floor(100 + Math.random() * 900); userAvatar = AVAILABLE_AVATARS[Math.floor(Math.random() * AVAILABLE_AVATARS.length)]; document.getElementById("user-display-name").innerText = `${username} (Guest)`; document.getElementById("user-display-avatar").innerText = userAvatar; showStartScreen(); }
        function logoutUser() { if (auth) { auth.signOut(); } else { showAuthScreen(); } }
        function shuffleArray(array) { let arr = [...array]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
        function startGame(sem) { let questions = (sem === 'all') ? [...reactionsData] : reactionsData.filter(q => q.sem === sem); currentQuestions = shuffleArray(questions); currentIdx = 0; score = 0; totalAnswered = 0; correctCount = 0; updateHeader(); loadQuestion(); document.getElementById("start-screen").classList.add("hidden"); document.getElementById("quiz-screen").classList.remove("hidden"); document.getElementById("quiz-screen").classList.add("flex"); }
        function getAccuracy() { return totalAnswered === 0 ? 100 : Math.round((correctCount / totalAnswered) * 100); }
        function updateHeader() { document.getElementById("score-display").innerText = `${score} XP`; document.getElementById("accuracy-display").innerText = `${getAccuracy()}%`; document.getElementById("progress-bar").style.width = `${(currentIdx / currentQuestions.length) * 100}%`; }
        function loadQuestion() { if (currentIdx >= currentQuestions.length) { finishGame(); return; } const q = currentQuestions[currentIdx]; document.getElementById("semester-badge").innerText = `Semester ${q.sem}`; document.getElementById("category-badge").innerText = q.category; document.getElementById("question-text").innerText = q.question; document.getElementById("options-container").innerHTML = ""; shuffleArray(q.options).forEach(opt => { const btn = document.createElement("button"); btn.className = "option-btn w-full bg-gray-800 border-2 border-gray-700 text-white font-semibold py-3.5 px-4 rounded-xl text-left hover:border-gray-500 transition text-sm sm:text-base"; btn.innerText = opt; btn.onclick = () => checkAnswer(opt, q.answer, btn); document.getElementById("options-container").appendChild(btn); }); document.getElementById("feedback-card").classList.add("hidden"); }
        function checkAnswer(selected, correct, btn) { document.querySelectorAll(".option-btn").forEach(b => b.disabled = true); totalAnswered++; const isCorrect = selected === correct; if (isCorrect) { score += 10; correctCount++; } btn.classList.add(isCorrect ? "bg-green-900/50 border-[#58cc02]" : "bg-red-900/50 border-red-500"); const card = document.getElementById("feedback-card"), title = document.getElementById("feedback-title"), detail = document.getElementById("feedback-detail"), icon = document.getElementById("feedback-icon"), nextBtn = document.getElementById("next-btn"); card.className = `rounded-xl p-4 mt-6 ${isCorrect ? 'bg-[#20380a] border-[#58cc02]' : 'bg-[#37191e] border-red-500'}`; icon.className = `fa-solid ${isCorrect ? 'fa-circle-check text-[#58cc02]' : 'fa-circle-xmark text-red-500'} text-2xl`; title.className = `font-bold text-lg ${isCorrect ? 'text-[#58cc02]' : 'text-red-500'}`; title.innerText = isCorrect ? "Correct!" : "Incorrect!"; detail.innerText = isCorrect ? "+10 XP Earned" : `Correct Answer: ${correct}`; nextBtn.className = `w-full py-3 rounded-xl font-bold text-white uppercase tracking-wider ${isCorrect ? 'bg-[#58cc02]' : 'bg-red-500'}`; card.classList.remove("hidden"); updateHeader(); }
        function nextQuestion() { currentIdx++; loadQuestion(); }
        function finishGame() { if (db) { const payload = { name: username, avatar: userAvatar, score: score, accuracy: getAccuracy(), correct: correctCount, total: totalAnswered, updatedAt: Date.now() }; if (currentUser) { const ref = db.ref('global_leaderboard/' + currentUser.uid); ref.once('value', s => { const prev = s.val(); if (!prev || payload.accuracy > prev.accuracy || (payload.accuracy === prev.accuracy && payload.score > prev.score)) { ref.set(payload); } }); } else { const cleanName = username.replace(/[.#$\\[\\]]/g, "_"); const ref = db.ref('global_leaderboard/guest_' + cleanName); ref.once('value', s => { const prev = s.val(); if (!prev || payload.accuracy > prev.accuracy || (payload.accuracy === prev.accuracy && payload.score > prev.score)) { ref.set(payload); } }); } } showGlobalLeaderboard(); }
        let leaderboardListener = null; function showGlobalLeaderboard() { if (db && leaderboardListener) { db.ref('global_leaderboard').off('value', leaderboardListener); } document.getElementById("start-screen").classList.add("hidden"); document.getElementById("quiz-screen").classList.add("hidden"); document.getElementById("leaderboard-screen").classList.remove("hidden"); const list = document.getElementById("leaderboard-list"); list.innerHTML = `<div class="text-center py-6 text-gray-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Loading...</div>`; if (!db) { list.innerHTML = `<div class="text-center p-4 bg-gray-800 rounded-xl text-amber-400 text-sm">Database not connected.</div>`; return; } leaderboardListener = db.ref('global_leaderboard').on('value', snapshot => { list.innerHTML = ""; const data = snapshot.val(); if (!data) { list.innerHTML = `<div class="text-center text-gray-400 py-4">Be the first on the leaderboard!</div>`; return; } const players = Object.values(data).sort((a, b) => b.accuracy - a.accuracy || b.score - a.score); players.slice(0, 50).forEach((entry, rank) => { const item = document.createElement("div"); const isMe = entry.name === username; item.className = `flex justify-between items-center p-3 rounded-xl border ${isMe?"bg-[#20380a] border-[#58cc02]":"bg-gray-800 border-gray-700"}`; item.innerHTML = `<div class="flex items-center gap-3"><span class="font-bold w-6 ${rank===0?"text-amber-400":rank===1?"text-gray-300":rank===2?"text-amber-600":"text-gray-500"}">#${rank+1}</span><span class="text-2xl">${entry.avatar||"🧪"}</span><div><div class="font-bold text-white text-sm sm:text-base">${entry.name}</div><div class="text-xs text-gray-400">${entry.correct}/${entry.total} Correct (${entry.score} XP)</div></div></div><div class="font-extrabold text-cyan-400 text-md sm:text-lg">${entry.accuracy}%</div>`; list.appendChild(item); }); }); }
        function restartApp() { if (db && leaderboardListener) { db.ref('global_leaderboard').off('value', leaderboardListener); leaderboardListener = null; } showStartScreen(); }
    </script>
</body>
</html>
