
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemLingo - Chemistry Practice</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #131f24; color: white; }
    .duo-btn {
      box-shadow: 0 4px 0 #46a302;
      transition: all 0.1s ease;
    }
    .duo-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #46a302;
    }
    .option-btn {
      box-shadow: 0 4px 0 #37464f;
    }
    .option-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #37464f;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between max-w-md mx-auto border-x border-gray-800">

  <!-- TOP BAR -->
  <div class="p-4 flex justify-between items-center border-b border-gray-800 bg-[#131f24] sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-bolt text-amber-500 text-xl"></i>
      <span id="score-display" class="font-bold text-amber-500 text-base sm:text-lg">0 XP</span>
    </div>

    <!-- Progress Bar -->
    <div class="w-1/3 bg-gray-700 h-4 rounded-full overflow-hidden">
      <div id="progress-bar" class="bg-[#58cc02] h-full w-0 transition-all duration-300"></div>
    </div>

    <!-- Accuracy Display (Replaced Life System) -->
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-bullseye text-cyan-400 text-xl"></i>
      <span id="accuracy-display" class="font-bold text-cyan-400 text-base sm:text-lg">100%</span>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="p-5 flex-1 flex flex-col justify-center">

    <!-- START & SEMESTER SELECTION SCREEN -->
    <div id="start-screen" class="text-center space-y-5">
      <div class="text-6xl text-[#58cc02]"><i class="fa-solid fa-flask"></i></div>
      <h1 class="text-3xl font-extrabold text-white">ChemLingo</h1>
      <p class="text-gray-400 text-sm">Select a semester level to start practicing!</p>
      
      <input type="text" id="username-input" placeholder="Enter your player name" 
        class="w-full p-3 rounded-xl bg-gray-800 border-2 border-gray-700 text-white font-bold focus:outline-none focus:border-[#58cc02] text-center">
      
      <div class="space-y-3 pt-2">
        <button onclick="startGame(1)" class="duo-btn w-full bg-[#58cc02] hover:bg-[#46a302] text-white font-bold py-3.5 rounded-xl uppercase tracking-wider text-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-atom"></i> Semester 1 (Inorganic)
        </button>

        <button onclick="startGame(3)" class="duo-btn w-full bg-[#1cb0f6] hover:bg-[#1899d6] text-white font-bold py-3.5 rounded-xl uppercase tracking-wider text-md flex items-center justify-center gap-2" style="box-shadow: 0 4px 0 #1899d6;">
          <i class="fa-solid fa-dna"></i> Semester 3 (Organic)
        </button>

        <button onclick="startGame('all')" class="duo-btn w-full bg-[#ffb800] hover:bg-[#e0a200] text-gray-900 font-extrabold py-3.5 rounded-xl uppercase tracking-wider text-md flex items-center justify-center gap-2" style="box-shadow: 0 4px 0 #d69b00;">
          <i class="fa-solid fa-bolt"></i> Mixed (Sem 1 + Sem 3)
        </button>
      </div>

      <button onclick="showLeaderboard()" class="w-full bg-gray-800 border-2 border-gray-700 text-gray-300 font-bold py-3 rounded-xl uppercase tracking-wider text-sm mt-4">
        <i class="fa-solid fa-trophy text-amber-400 mr-2"></i> View Leaderboard
      </button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden flex-col justify-between flex-1">
      <div>
        <div class="flex justify-between items-center mb-4">
          <span id="semester-badge" class="bg-gray-800 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full text-[#58cc02]">
            Semester
          </span>
          <span id="category-badge" class="bg-gray-800 text-xs font-semibold uppercase tracking-wider px-3 py-1 rounded-full text-gray-400">
            Category
          </span>
        </div>
        <h2 id="question-text" class="text-lg sm:text-xl font-bold mb-6 text-white leading-relaxed">
          Question text will appear here...
        </h2>

        <div id="options-container" class="space-y-3">
          <!-- Dynamic Options -->
        </div>
      </div>

      <!-- FEEDBACK BAR -->
      <div id="feedback-card" class="hidden rounded-xl p-4 mt-6">
        <div class="flex items-center gap-3 mb-2">
          <i id="feedback-icon" class="text-2xl"></i>
          <span id="feedback-title" class="font-bold text-lg"></span>
        </div>
        <p id="feedback-detail" class="text-sm font-medium mb-4"></p>
        <button id="next-btn" onclick="nextQuestion()" class="w-full py-3 rounded-xl font-bold text-white uppercase tracking-wider">
          Continue
        </button>
      </div>
    </div>

    <!-- LEADERBOARD SCREEN -->
    <div id="leaderboard-screen" class="hidden space-y-4">
      <div class="text-center">
        <h2 class="text-2xl font-extrabold text-amber-400"><i class="fa-solid fa-trophy mr-2"></i> Real-Time Leaderboard</h2>
        <p class="text-xs text-gray-400 mt-1">Rankings are ordered by Accuracy (%) first, then Total XP.</p>
      </div>
      
      <div id="leaderboard-list" class="space-y-2 max-h-80 overflow-y-auto">
        <!-- Dynamic Leaderboard Content -->
      </div>

      <button onclick="restartApp()" class="duo-btn w-full bg-[#58cc02] text-white font-bold py-3 rounded-xl uppercase">
        Main Menu
      </button>
    </div>

  </main>

  <!-- JAVASCRIPT & REACTION DATASETS -->
  <script>
    // DATASET INCLUDING ALL SEMESTER 1 & EXPANDED SEMESTER 3 REACTIONS
    const reactionsData = [
      // SEMESTER 1 - Inorganic Chemistry
      { sem: 1, category: "Period 3 Oxygen", question: "Complete the reaction: 4Na + O₂ ➔ ?", options: ["2Na₂O", "Na₂O₂", "2NaO", "Na₂O₃"], answer: "2Na₂O" },
      { sem: 1, category: "Period 3 Oxygen", question: "What is formed when Sodium reacts with excess Oxygen under heat?", options: ["2Na + O₂ ➔ Na₂O₂", "4Na + O₂ ➔ 2Na₂O", "Na + O₂ ➔ NaO₂", "2Na + 2O₂ ➔ Na₂O₄"], answer: "2Na + O₂ ➔ Na₂O₂" },
      { sem: 1, category: "Period 3 Acid/Base", question: "What product forms when Al₂O₃ reacts with hot aqueous NaOH?", options: ["2NaAl(OH)₄", "Na₂AlO₂ + H₂O", "Al(OH)₃ + 2NaCl", "Na₂SO₄"], answer: "2NaAl(OH)₄" },
      { sem: 1, category: "Group 17 Halogens", question: "What are the main products of Cl₂ + 2NaOH (COLD)?", options: ["NaCl + NaClO + H₂O", "5NaCl + NaClO₃ + 3H₂O", "NaCl + HClO", "NaClO₃ + H₂"], answer: "NaCl + NaClO + H₂O" },
      { sem: 1, category: "Halides Test", question: "What precipitate color is formed when Ag⁺ reacts with I⁻?", options: ["AgI (yellow)", "AgCl (white)", "AgBr (cream)", "Ag₂O (black)"], answer: "AgI (yellow)" },

      // SEMESTER 3 - Organic Chemistry
      // Alkanes
      { sem: 3, category: "Alkanes", question: "Alkane + X₂ ➔ Haloalkane + HX requires which condition?", options: ["UV Light", "FeX₃ catalyst", "Reflux with NaOH", "Ni at 180°C"], answer: "UV Light" },
      { sem: 3, category: "Alkanes", question: "What are the coefficients for complete combustion of C_x H_y + ? O₂ ➔ x CO₂ + (y/2) H₂O?", options: ["(x + y/4)", "(x + y/2)", "(2x + y/4)", "(x/2 + y)"], answer: "(x + y/4)" },

      // Alkenes
      { sem: 3, category: "Alkenes (EAR)", question: "Catalytic hydrogenation of Alkene (>C=C< + H₂) to Alkane requires:", options: ["Ni catalyst at 140°C", "UV Light", "Conc. H₂SO₄", "FeX₃"], answer: "Ni catalyst at 140°C" },
      { sem: 3, category: "Alkenes (EAR)", question: "What product is formed when an alkene reacts with X₂ in CH₂Cl₂ at room temp?", options: ["Vicinal Dihaloalkane (-CX-CX-)", "Halohydrin (-CX-COH-)", "Alkane", "Haloalkane + HX"], answer: "Vicinal Dihaloalkane (-CX-CX-)" },
      { sem: 3, category: "Alkenes (EAR)", question: "Reaction of Alkene with X₂ + H₂O yields what product?", options: ["Halohydrin (-CX-COH-) + H₃O⁺ + X⁻", "Dihaloalkane", "Alcohol", "Alkane"], answer: "Halohydrin (-CX-COH-) + H₃O⁺ + X⁻" },
      { sem: 3, category: "Alkenes (EAR)", question: "Cleavage of R(R')C=CH(R'') with hot acidified KMnO₄ yields:", options: ["Ketone + Carboxylic Acid", "Two Aldehydes", "Two Alcohols", "Ozonide"], answer: "Ketone + Carboxylic Acid" },
      { sem: 3, category: "Alkenes (EAR)", question: "Reaction of alkene with O₃ at -78°C followed by (CH₃)₂S treatment yields:", options: ["Ketone + Aldehyde", "Carboxylic Acid + CO₂", "Dihaloalkane", "Alcohol"], answer: "Ketone + Aldehyde" },

      // Arenes
      { sem: 3, category: "Arenes (EAS)", question: "Benzene + X₂ ➔ Halobenzene + HX requires which catalyst?", options: ["FeX₃", "AlCl₃", "Conc. H₂SO₄", "UV Light"], answer: "FeX₃" },
      { sem: 3, category: "Arenes (EAS)", question: "Nitration of Benzene to form Nitrobenzene requires:", options: ["Conc. HNO₃ + Conc. H₂SO₄ (< 55°C)", "Dilute HNO₃ at r.t.", "HNO₃ + FeX₃", "KMnO₄ / H⁺"], answer: "Conc. HNO₃ + Conc. H₂SO₄ (< 55°C)" },

      // Haloalkanes & Grignard
      { sem: 3, category: "Haloalkanes", question: "RX + KCN (aq) in ethanol under heat produces:", options: ["Nitrile (R-C≡N) + KX", "Primary Amine", "Alcohol", "Grignard Reagent"], answer: "Nitrile (R-C≡N) + KX" },
      { sem: 3, category: "Haloalkanes", question: "Reaction to form a Grignard Reagent (RMgX):", options: ["R-X + Mg in dry ether", "R-X + Mg in H₂O", "R-X + NaOH", "R-X + Na in ether"], answer: "R-X + Mg in dry ether" },

      // Formation of Carboxylic Acids (From Notebook Images)
      { sem: 3, category: "Carboxylic Acids", question: "RMgBr + CO₂ in dry ether (r.t.) followed by H₃O⁺ / Δ yields:", options: ["RCOOH + Mg(OH)Br", "RCH₂OH", "RCHO", "RCOOR'"], answer: "RCOOH + Mg(OH)Br" },
      { sem: 3, category: "Carboxylic Acids", question: "Oxidation of RCH₂OH with KMnO₄ / H⁺ at room temperature produces:", options: ["RCOOH + H₂O", "RCHO + H₂", "RCOR' + H₂O", "RCOCl"], answer: "RCOOH + H₂O" },
      { sem: 3, category: "Carboxylic Acids", question: "Hydrolysis of Nitrile with aqueous acid (RCN + H₂O + H⁺ / Δ) yields:", options: ["RCOOH + NH₄⁺", "RCOO⁻ + NH₃", "RCH₂NH₂", "RCONH₂"], answer: "RCOOH + NH₄⁺" },
      { sem: 3, category: "Carboxylic Acids", question: "Hydrolysis of Nitrile with aqueous base (RCN + H₂O + OH⁻ / Δ) yields:", options: ["RCOO⁻ + NH₃", "RCOOH + NH₄⁺", "RCH₂NH₂", "RCONH₂"], answer: "RCOO⁻ + NH₃" },
      { sem: 3, category: "Carboxylic Acids", question: "Reaction of Primary Amide with Nitrous Acid (RCONH₂ + NaNO₂ + HCl at r.t.) produces:", options: ["RCOOH + N₂ + H₂O + NaCl", "RCH₂NH₂ + NaCl", "RCN + H₂O", "RCOCl + NH₄Cl"], answer: "RCOOH + N₂ + H₂O + NaCl" },

      // Carbonyl Compounds
      { sem: 3, category: "Carbonyls", question: "Hydrogenation of Ketone (R₂C=O + H₂ over Ni at 180°C) yields:", options: ["Secondary Alcohol (R₂CHOH)", "Primary Alcohol", "Carboxylic Acid", "Alkene"], answer: "Secondary Alcohol (R₂CHOH)" },
      { sem: 3, category: "Carbonyls", question: "Reduction of Aldehyde (RCHO) with 1. LiAlH₄ in dry ether, 2. H₃O⁺ / Δ yields:", options: ["Primary Alcohol (RCH₂OH)", "Secondary Alcohol", "Carboxylic Acid", "Alkane"], answer: "Primary Alcohol (RCH₂OH)" },

      // Chemical Reactions of RCOOH
      { sem: 3, category: "Carboxylic Acid Reactions", question: "RCOOH + Na₂CO₃ under heat produces:", options: ["RCOONa + CO₂ + H₂O", "RCOONa + H₂", "RCOOCH₃", "RCOCl + NaHCO₃"], answer: "RCOONa + CO₂ + H₂O" },
      { sem: 3, category: "Carboxylic Acid Reactions", question: "RCOOH + SOCl₂ at room temperature produces:", options: ["RCOCl + SO₂ + HCl", "RCOCl + POCl₃ + HCl", "RCOCl + H₃PO₃", "RCOOR' + H₂O"], answer: "RCOCl + SO₂ + HCl" },
      { sem: 3, category: "Carboxylic Acid Reactions", question: "RCOOH + PCl₅ at room temperature produces:", options: ["RCOCl + POCl₃ + HCl", "RCOCl + SO₂ + HCl", "RCOCl + H₃PO₃", "RCOOR'"], answer: "RCOCl + POCl₃ + HCl" },
      { sem: 3, category: "Carboxylic Acid Reactions", question: "Electrophilic Nitration of Benzoic Acid (Benzoic Acid + HNO₃ with conc. H₂SO₄ at <55°C) yields:", options: ["m-nitrobenzoic acid + H₂O", "o-nitrobenzoic acid", "p-nitrobenzoic acid", "Nitrobenzene"], answer: "m-nitrobenzoic acid + H₂O" },

      // Acyl Chlorides
      { sem: 3, category: "Acyl Chloride", question: "RCOCl + H₂O at room temperature produces:", options: ["RCOOH + HCl", "RCOOCH₃", "RCONH₂", "RCHO"], answer: "RCOOH + HCl" },
      { sem: 3, category: "Acyl Chloride", question: "Reaction of Sodium Phenoxide (PhONa) + RCOCl at room temp yields:", options: ["Phenyl Ester (RCOOPh) + NaCl", "Benzoic Acid", "Phenyl Acetate + HCl", "Phenol + RCOOH"], answer: "Phenyl Ester (RCOOPh) + NaCl" },
      { sem: 3, category: "Acyl Chloride", question: "RCOCl + Primary Amine (R'NH₂) at room temp yields:", options: ["Secondary Amide (RCONHR') + HCl", "Primary Amide + HCl", "Tertiary Amide", "Nitrile"], answer: "Secondary Amide (RCONHR') + HCl" },

      // Esters & Amides
      { sem: 3, category: "Esters & Amides", question: "Alkaline Hydrolysis of Ester (RCOOR' + NaOH under heat) yields:", options: ["RCOONa + R'OH", "RCOOH + R'OH", "RCH₂OH + R'OH", "RCOONa + H₂O"], answer: "RCOONa + R'OH" },
      { sem: 3, category: "Esters & Amides", question: "Reduction of Ester (R'COOR) with 1. LiAlH₄ (dry ether) / 2. H₃O⁺, Δ yields:", options: ["R'CH₂OH + ROH", "R'COOH + ROH", "R'CH₃ + ROH", "R'CHO + ROH"], answer: "R'CH₂OH + ROH" },
      { sem: 3, category: "Esters & Amides", question: "Reduction of Amide (R'CONH₂) with 1. LiAlH₄ (dry ether) / 2. H₃O⁺, Δ yields:", options: ["Primary Amine (R'CH₂NH₂) + H₂O", "R'COOH + NH₃", "R'CN + H₂O", "R'CH₂OH + NH₃"], answer: "Primary Amine (R'CH₂NH₂) + H₂O" }
    ];

    // APP STATE
    let currentQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let totalAnswered = 0;
    let correctCount = 0;
    let username = "Player";

    // INITIAL LEADERBOARD DATA (Ranked by Accuracy %)
    let localLeaderboard = [
      { name: "ChemPro", score: 200, correct: 20, total: 20, accuracy: 100 },
      { name: "OrganicMaster", score: 180, correct: 18, total: 20, accuracy: 90 },
      { name: "AtomGuru", score: 120, correct: 12, total: 15, accuracy: 80 }
    ];

    // Fisher-Yates Shuffle
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startGame(selectedSem) {
      const input = document.getElementById("username-input").value.trim();
      if(input) username = input;
      
      if (selectedSem === 'all') {
        currentQuestions = [...reactionsData];
      } else {
        currentQuestions = reactionsData.filter(q => q.sem === selectedSem);
      }

      currentQuestions = shuffleArray(currentQuestions);

      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      document.getElementById("quiz-screen").classList.add("flex");
      
      currentIdx = 0;
      score = 0;
      totalAnswered = 0;
      correctCount = 0;
      updateHeader();
      loadQuestion();
    }

    function getAccuracy() {
      if (totalAnswered === 0) return 100;
      return Math.round((correctCount / totalAnswered) * 100);
    }

    function updateHeader() {
      document.getElementById("score-display").innerText = `${score} XP`;
      document.getElementById("accuracy-display").innerText = `${getAccuracy()}%`;
      const progressPercent = ((currentIdx) / currentQuestions.length) * 100;
      document.getElementById("progress-bar").style.width = `${progressPercent}%`;

      // Update Real-time leaderboard entry
      updateLiveLeaderboard();
    }

    function loadQuestion() {
      if (currentIdx >= currentQuestions.length) {
        finishGame();
        return;
      }

      const q = currentQuestions[currentIdx];
      document.getElementById("semester-badge").innerText = `Semester ${q.sem}`;
      document.getElementById("category-badge").innerText = q.category;
      document.getElementById("question-text").innerText = q.question;
      document.getElementById("feedback-card").classList.add("hidden");

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      const shuffledOptions = shuffleArray(q.options);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn w-full bg-gray-800 border-2 border-gray-700 text-white font-semibold py-3.5 px-4 rounded-xl text-left hover:border-gray-500 transition text-sm sm:text-base";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, q.answer, btn);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct, selectedBtn) {
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(b => b.disabled = true);

      totalAnswered++;

      const feedbackCard = document.getElementById("feedback-card");
      const feedbackTitle = document.getElementById("feedback-title");
      const feedbackDetail = document.getElementById("feedback-detail");
      const feedbackIcon = document.getElementById("feedback-icon");
      const nextBtn = document.getElementById("next-btn");

      feedbackCard.classList.remove("hidden");

      if (selected === correct) {
        score += 10;
        correctCount++;
        selectedBtn.classList.add("bg-green-900/50", "border-[#58cc02]");
        feedbackCard.className = "rounded-xl p-4 mt-6 bg-[#20380a] border border-[#58cc02]";
        feedbackIcon.className = "fa-solid fa-circle-check text-[#58cc02] text-2xl";
        feedbackTitle.className = "font-bold text-lg text-[#58cc02]";
        feedbackTitle.innerText = "Correct!";
        feedbackDetail.innerText = "+10 XP Earned";
        nextBtn.className = "w-full py-3 rounded-xl font-bold text-white uppercase tracking-wider bg-[#58cc02]";
      } else {
        selectedBtn.classList.add("bg-red-900/50", "border-red-500");
        feedbackCard.className = "rounded-xl p-4 mt-6 bg-[#37191e] border border-red-500";
        feedbackIcon.className = "fa-solid fa-circle-xmark text-red-500 text-2xl";
        feedbackTitle.className = "font-bold text-lg text-red-500";
        feedbackTitle.innerText = "Incorrect!";
        feedbackDetail.innerText = `Correct Answer: ${correct}`;
        nextBtn.className = "w-full py-3 rounded-xl font-bold text-white uppercase tracking-wider bg-red-500";
      }

      updateHeader();
    }

    function updateLiveLeaderboard() {
      // Find or create player's entry
      const existingIdx = localLeaderboard.findIndex(item => item.name === username);
      const playerData = {
        name: username,
        score: score,
        correct: correctCount,
        total: totalAnswered,
        accuracy: getAccuracy()
      };

      if (existingIdx !== -1) {
        localLeaderboard[existingIdx] = playerData;
      } else if (totalAnswered > 0) {
        localLeaderboard.push(playerData);
      }

      // Sort Real-Time Leaderboard based on Accuracy (%) first, then Score (XP) second
      localLeaderboard.sort((a, b) => {
        if (b.accuracy !== a.accuracy) {
          return b.accuracy - a.accuracy;
        }
        return b.score - a.score;
      });
    }

    function nextQuestion() {
      currentIdx++;
      loadQuestion();
    }

    function finishGame() {
      updateLiveLeaderboard();
      showLeaderboard();
    }

    function showLeaderboard() {
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("flex");
      document.getElementById("leaderboard-screen").classList.remove("hidden");

      const list = document.getElementById("leaderboard-list");
      list.innerHTML = "";

      localLeaderboard.slice(0, 10).forEach((entry, rank) => {
        const item = document.createElement("div");
        item.className = `flex justify-between items-center p-3 rounded-xl border ${
          entry.name === username ? "bg-[#20380a] border-[#58cc02]" : "bg-gray-800 border-gray-700"
        }`;
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="font-bold text-gray-400 w-6">#${rank + 1}</span>
            <div>
              <div class="font-bold text-white text-sm sm:text-base">${entry.name}</div>
              <div class="text-xs text-gray-400">${entry.correct}/${entry.total} Correct (${entry.score} XP)</div>
            </div>
          </div>
          <div class="font-extrabold text-cyan-400 text-md sm:text-lg">${entry.accuracy}%</div>
        `;
        list.appendChild(item);
      });
    }

    function restartApp() {
      document.getElementById("leaderboard-screen").classList.add("hidden");
      document.getElementById("start-screen").classList.remove("hidden");
    }
  </script>
</body>
</html>
